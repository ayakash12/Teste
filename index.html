  el.innerHTML = "<b>" + esc(T().embT) + "</b> " + esc(T().embP.replace("{q}", q));
  el.hidden = false;
}

/* ---------------------------------------------- 7. INDEXEDDB */
function abrirDb(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error("sem indexedDB"));
    const rq = indexedDB.open("NS_CLIMA_SISMO_LATAM", 2);
    rq.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains("registros"))
        db.createObjectStore("registros",{keyPath:"id",autoIncrement:true});
      // rev.07: retencao local do dado sismico coletado (clausula 11.3.4)
      if(!db.objectStoreNames.contains("sismos"))
        db.createObjectStore("sismos",{keyPath:"k"});
    };
    rq.onsuccess = e=>res(e.target.result);
    rq.onerror = ()=>rej(rq.error);
  });
}
async function carregarRegs(){
  try{
    const db = await abrirDb();
    REGS = await new Promise((res,rej)=>{
      const rq = db.transaction("registros","readonly").objectStore("registros").getAll();
      rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error);
    });
    REGS.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
    dbOk = true;
  }catch(e){ dbOk=false; REGS=[]; }
  setDb();
}
async function salvarReg(reg){
  const db = await abrirDb();
  await new Promise((res,rej)=>{
    const rq = db.transaction("registros","readwrite").objectStore("registros").add(reg);
    rq.onsuccess=()=>res(); rq.onerror=()=>rej(rq.error);
  });
}
/* -------------------------------------------------- MEMORIA SISMICA LOCAL
   Retencao de 30 dias corridos, deduplicada pela chave identificador+site.
   Finalidades (clausula 11.3.5): preservar o historico quando a consulta ao
   provedor falha; permitir comparar turnos, uma vez que o reprocessamento de
   magnitude e rotineiro nas primeiras horas; e constituir registro auditavel.
   NAO substitui a retencao corporativa de cinco anos. */
const RET_MS = 30*24*3600*1000;

async function gravarSismos(lista){
  if(!lista.length) return;
  const db = await abrirDb();
  await new Promise((res,rej)=>{
    const tx = db.transaction("sismos","readwrite");
    const st = tx.objectStore("sismos");
    const corte = Date.now() - RET_MS;
    lista.forEach(e=>{
      if(e.quando && e.quando >= corte)
        st.put({k:(e.id||("x"+e.quando))+"|"+e.site, id:e.id, site:e.site, pais:e.pais,
                mag:e.mag, prof:e.prof, dist:e.dist, quando:e.quando, local:e.local, nivel:e.nivel});
    });
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}
async function lerSismos(desde){
  const db = await abrirDb();
  const todos = await new Promise((res,rej)=>{
    const rq = db.transaction("sismos","readonly").objectStore("sismos").getAll();
    rq.onsuccess = ()=>res(rq.result||[]); rq.onerror = ()=>rej(rq.error);
  });
  return todos.filter(e=>e.quando >= desde);
}
async function purgarSismos(){
  try{
    const db = await abrirDb();
    const corte = Date.now() - RET_MS;
    await new Promise(res=>{
      const tx = db.transaction("sismos","readwrite");
      const st = tx.objectStore("sismos");
      const rq = st.getAll();
      rq.onsuccess = ()=>{ (rq.result||[]).forEach(e=>{ if(e.quando < corte) st.delete(e.k); }); };
      tx.oncomplete = ()=>res(); tx.onerror = ()=>res();
    });
  }catch(e){ /* memoria indisponivel: segue com dado ao vivo */ }
}

function setDb(){
  const d=document.getElementById("dotDb");
  if(!d) return;
  d.className = "dot "+(dbOk?"ok":"er");
  document.getElementById("txtDb").textContent = dbOk?T().dbOk:T().dbEr;
}

/* =========================================================================
   8. GRAFICOS EM SVG — desenhados no proprio arquivo, sem biblioteca
   ========================================================================= */
const SW=880, SH=330, M={t:18,r:22,b:44,l:52};
const PW = SW-M.l-M.r, PH = SH-M.t-M.b;

function svgOpen(){ return `<svg viewBox="0 0 ${SW} ${SH}" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">`; }
function txt(x,y,s,o={}){
  return `<text x="${x}" y="${y}" font-size="${o.fs||10}" fill="${o.c||"#6B7280"}"`
    + ` text-anchor="${o.a||"start"}"${o.b?' font-weight="700"':''}>${esc(s)}</text>`;
}
function eixo(){
  return `<line x1="${M.l}" y1="${M.t+PH}" x2="${M.l+PW}" y2="${M.t+PH}" stroke="#1F3864" stroke-width="1"/>`
       + `<line x1="${M.l}" y1="${M.t}" x2="${M.l}" y2="${M.t+PH}" stroke="#1F3864" stroke-width="1"/>`;
}
const vazio = () => svgOpen() + txt(SW/2, SH/2, T().emSismos.slice(0,70), {a:"middle", fs:12}) + "</svg>";

/* --- 8.1 cronologico em hastes, sobre faixas de escala --- */
function gCron(ev){
  if(!ev.length) return vazio();
  const t1 = Date.now(), t0 = t1 - JANELA*24*3600*1000;
  const magMax = Math.max(6.5, Math.ceil(Math.max(...ev.map(e=>e.mag||0))*2)/2);
  const x = t => M.l + (Math.min(Math.max(t,t0),t1)-t0)/(t1-t0)*PW;
  const y = m => M.t + PH - (m/magMax)*PH;
  let g = svgOpen();
  // faixas de escala
  LIM_SISMO.forEach(l=>{
    const a = Math.min(l.max===Infinity?magMax:l.max+0.05, magMax), b = l.min;
    if(b>=magMax) return;
    g += `<rect class="band" x="${M.l}" y="${y(a)}" width="${PW}" height="${Math.max(0,y(b)-y(a))}"`
       + ` fill="${CORNV[l.nv]}" fill-opacity="0.07"/>`;
    g += `<line class="bandln" x1="${M.l}" y1="${y(b)}" x2="${M.l+PW}" y2="${y(b)}" stroke="${CORNV[l.nv]}"`
       + ` stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>`;
    if(b>0) g += txt(M.l+PW-3, y(b)-4, GLIFO[l.nv]+" "+T().lvl[l.nv]+" ≥ "+num(b,1),
      {a:"end", fs:9, c:CORNV[l.nv], b:1});
  });
  g += eixo();
  for(let m=0;m<=magMax;m+=1){ g += txt(M.l-7, y(m)+3, num(m,0), {a:"end", fs:9}); }
  g += txt(12, M.t+PH/2, "M", {fs:10, b:1, c:"#1F3864"});
  // hastes
  ev.forEach(e=>{
    const X = x(e.quando), Y = y(e.mag||0), c = CORNV[e.nivel];
    const w = ESPNV[e.nivel] || 1.4;
    const tr = e.origem === "memoria" ? ' stroke-dasharray="3 2"' : '';
    g += `<line class="clr" x1="${X}" y1="${M.t+PH}" x2="${X}" y2="${Y}" stroke="${c}" stroke-width="${w}"${tr}/>`;
    g += marcaNv(X, Y, e.nivel, 3.8);
  });
  // marcas de tempo
  const nt = 5;
  for(let i=0;i<=nt;i++){
    const t = t0 + (t1-t0)*i/nt, X = M.l + PW*i/nt;
    const d = new Date(t);
    const rot = JANELA===1
      ? d.toLocaleTimeString(LOC[LANG],{hour:"2-digit",minute:"2-digit"})
      : d.toLocaleDateString(LOC[LANG],{day:"2-digit",month:"2-digit"});
    g += `<line x1="${X}" y1="${M.t+PH}" x2="${X}" y2="${M.t+PH+4}" stroke="#B9CCEA"/>`;
    g += txt(X, M.t+PH+17, rot, {a:"middle", fs:9});
  }
  return g + "</svg>";
}

/* --- 8.2 magnitude x distancia, com zona de acionamento sombreada --- */
function gDisp(ev){
  if(!ev.length) return vazio();
  const dMax = Math.max(120, Math.ceil(Math.max(...ev.map(e=>e.dist||0))/100)*100);
  const magMax = Math.max(6.5, Math.ceil(Math.max(...ev.map(e=>e.mag||0))*2)/2);
  const x = d => M.l + (Math.min(d,dMax)/dMax)*PW;
  const y = m => M.t + PH - (m/magMax)*PH;
  let g = svgOpen();
  // zona de acionamento: M >= 4,0 e distancia <= 300 km (ambar) / <= 500 km (>= 5,0)
  g += `<rect class="band" x="${M.l}" y="${y(magMax)}" width="${Math.max(0,x(500)-M.l)}" height="${Math.max(0,y(5.0)-y(magMax))}" fill="${CORNV.vermelho}" fill-opacity="0.09"/>`;
  g += `<rect class="band" x="${M.l}" y="${y(5.0)}" width="${Math.max(0,x(300)-M.l)}" height="${Math.max(0,y(4.0)-y(5.0))}" fill="${CORNV.ambar}" fill-opacity="0.11"/>`;
  g += `<line class="bandln" x1="${M.l}" y1="${y(4.0)}" x2="${M.l+PW}" y2="${y(4.0)}" stroke="${CORNV.ambar}" stroke-width="1" stroke-dasharray="4 3"/>`;
  g += `<line class="bandln" x1="${M.l}" y1="${y(5.0)}" x2="${M.l+PW}" y2="${y(5.0)}" stroke="${CORNV.vermelho}" stroke-width="1" stroke-dasharray="4 3"/>`;
  if(x(300)<M.l+PW) g += `<line class="bandln" x1="${x(300)}" y1="${M.t}" x2="${x(300)}" y2="${M.t+PH}" stroke="${CORNV.ambar}" stroke-width="1" stroke-dasharray="2 4"/>`;
  if(x(500)<M.l+PW) g += `<line class="bandln" x1="${x(500)}" y1="${M.t}" x2="${x(500)}" y2="${M.t+PH}" stroke="${CORNV.vermelho}" stroke-width="1" stroke-dasharray="2 4"/>`;
  g += txt(M.l+6, y(magMax)+13, "▲ ■ "+(LANG==="en"?"activation zone":LANG==="es"?"zona de activación":"zona de acionamento"),
    {fs:9.5, b:1, c:CORNV.vermelho});
  g += eixo();
  for(let m=0;m<=magMax;m+=1) g += txt(M.l-7, y(m)+3, num(m,0), {a:"end", fs:9});
  const nd = 5;
  for(let i=0;i<=nd;i++){
    const X = M.l+PW*i/nd;
    g += `<line x1="${X}" y1="${M.t+PH}" x2="${X}" y2="${M.t+PH+4}" stroke="#B9CCEA"/>`;
    g += txt(X, M.t+PH+17, num(dMax*i/nd,0), {a:"middle", fs:9});
  }
  g += txt(M.l+PW/2, M.t+PH+34, T().thDist, {a:"middle", fs:10, b:1, c:"#1F3864"});
  g += txt(12, M.t+PH/2, "M", {fs:10, b:1, c:"#1F3864"});
  ev.forEach(e=>{
    g += marcaNv(x(e.dist||0), y(e.mag||0), e.nivel, 4.6);
  });
  return g + "</svg>";
}

/* --- 8.3 frequencia acumulada (linha legitima: grandeza continua) --- */
function gAcum(ev){
  if(!ev.length) return vazio();
  const t1 = Date.now(), t0 = t1 - JANELA*24*3600*1000;
  const ord = ev.slice().sort((a,b)=>(a.quando||0)-(b.quando||0));
  const n = ord.length;
  const x = t => M.l + (Math.min(Math.max(t,t0),t1)-t0)/(t1-t0)*PW;
  const y = c => M.t + PH - (c/Math.max(n,1))*PH;
  let g = svgOpen();
  for(let i=0;i<=4;i++){
    const Y = M.t+PH*i/4;
    g += `<line x1="${M.l}" y1="${Y}" x2="${M.l+PW}" y2="${Y}" stroke="#EAF0FA" stroke-width="1"/>`;
    g += txt(M.l-7, Y+3, num(Math.round(n*(4-i)/4),0), {a:"end", fs:9});
  }
  g += eixo();
  let d = `M ${M.l} ${y(0)}`, c = 0;
  ord.forEach(e=>{ const X = x(e.quando); d += ` L ${X} ${y(c)}`; c++; d += ` L ${X} ${y(c)}`; });
  d += ` L ${M.l+PW} ${y(c)}`;
  g += `<path class="clr" d="${d}" fill="none" stroke="#1F3864" stroke-width="2.2"/>`;
  ord.forEach((e,i)=>{ g += marcaNv(x(e.quando), y(i+1), e.nivel, 3.2); });
  const nt=5;
  for(let i=0;i<=nt;i++){
    const t = t0+(t1-t0)*i/nt, X = M.l+PW*i/nt, dd = new Date(t);
    const rot = JANELA===1 ? dd.toLocaleTimeString(LOC[LANG],{hour:"2-digit",minute:"2-digit"})
                           : dd.toLocaleDateString(LOC[LANG],{day:"2-digit",month:"2-digit"});
    g += txt(X, M.t+PH+17, rot, {a:"middle", fs:9});
  }
  g += txt(12, M.t+PH/2, "N", {fs:10, b:1, c:"#1F3864"});
  return g + "</svg>";
}

/* --- 8.4 rajada projetada, horizonte selecionavel (24 h / 72 h / 7 d) ---
   O trecho situado ALEM DE 72 HORAS e desenhado em traco tracejado: a pericia
   da previsao de rajada degrada acentuadamente apos esse horizonte, e o dado
   passa a ser de PLANEJAMENTO, sem valor de acionamento (clausula 8.4). */
function gProj(cod){
  const d = DADOS[cod];
  const Hall = (d && d.hora) || [];
  if(!Hall.length) return svgOpen()+txt(SW/2,SH/2,T().semDado,{a:"middle",fs:12})+"</svg>";
  const agora = Date.now();
  const limJan = agora + HORIZ*3600*1000;
  const limFia = agora + 72*3600*1000;          // fronteira de pericia
  const H = Hall.filter(h=>{
    const t = new Date(h.t).getTime();
    return t >= agora - 3600*1000 && t <= limJan;
  });
  if(H.length < 2) return svgOpen()+txt(SW/2,SH/2,T().semDado,{a:"middle",fs:12})+"</svg>";
  const vals = H.map(h=>h.raj).filter(v=>v!=null);
  if(!vals.length) return svgOpen()+txt(SW/2,SH/2,T().semDado,{a:"middle",fs:12})+"</svg>";
  const vMax = Math.max(90, Math.ceil(Math.max(...vals)/20)*20+10);
  const x = i => M.l + (i/(H.length-1))*PW;
  const y = v => M.t + PH - (Math.min(v,vMax)/vMax)*PH;
  let g = svgOpen();

  LIM_VENTO.forEach(l=>{
    const a = Math.min(l.max===Infinity?vMax:l.max+1, vMax), b = l.min;
    if(b>=vMax) return;
    g += `<rect class="band" x="${M.l}" y="${y(a)}" width="${PW}" height="${Math.max(0,y(b)-y(a))}" fill="${CORNV[l.nv]}" fill-opacity="0.07"/>`;
    if(b>0){
      g += `<line class="bandln" x1="${M.l}" y1="${y(b)}" x2="${M.l+PW}" y2="${y(b)}" stroke="${CORNV[l.nv]}" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>`;
      g += txt(M.l+PW-3, y(b)-4, GLIFO[l.nv]+" "+T().lvl[l.nv]+" ≥ "+b+" km/h", {a:"end", fs:9, c:CORNV[l.nv], b:1});
    }
  });
  g += eixo();
  for(let v=0; v<=vMax; v+=20) g += txt(M.l-7, y(v)+3, num(v,0), {a:"end", fs:9});
  g += txt(12, M.t+PH/2, "km/h", {fs:9, b:1, c:"#1F3864"});

  // --- fronteira de pericia de 72 h, quando visivel na janela
  let iFia = -1;
  for(let i=0;i<H.length;i++){ if(new Date(H[i].t).getTime() > limFia){ iFia = i; break; } }
  if(iFia > 0){
    const XF = x(iFia);
    g += `<rect class="band" x="${XF}" y="${M.t}" width="${Math.max(0,M.l+PW-XF)}" height="${PH}" fill="#6B7280" fill-opacity="0.05"/>`;
    g += `<line class="bandln" x1="${XF}" y1="${M.t}" x2="${XF}" y2="${M.t+PH}" stroke="${CORNV.ambar}" stroke-width="1.4" stroke-dasharray="5 3"/>`;
    g += txt(XF+5, M.t+11, "72 h \u2192 " + (LANG==="en" ? "planning only" : LANG==="es" ? "solo planificación" : "somente planejamento"),
      {fs:9, b:1, c:"#8A5A0B"});
  }

  // --- linha: trecho continuo ate 72 h, tracejado depois
  let p1 = "", p2 = "";
  H.forEach((h,i)=>{
    if(h.raj == null) return;
    const seg = (i>=0 && iFia>=0 && i>=iFia-1) ? 2 : 1;
    const cmd = (seg===1 ? (p1 ? " L " : "M ") : (p2 ? " L " : "M ")) + x(i) + " " + y(h.raj);
    if(seg===1) p1 += cmd; else p2 += cmd;
  });
  if(p1) g += `<path class="clr" d="${p1}" fill="none" stroke="#1F3864" stroke-width="2.2"/>`;
  if(p2) g += `<path class="clr" d="${p2}" fill="none" stroke="#1F3864" stroke-width="1.8" stroke-dasharray="6 4"/>`;

  // --- marcadores por FORMA nos pontos que atingem ambar ou mais
  H.forEach((h,i)=>{
    if(h.raj == null) return;
    const nv = nivelVento(h.raj);
    if(nv !== "verde") g += marcaNv(x(i), y(h.raj), nv, 3.6);
  });

  // --- marca de agora
  const iAg = H.findIndex(h=>new Date(h.t) >= new Date());
  if(iAg > 0){
    g += `<line class="bandln" x1="${x(iAg)}" y1="${M.t}" x2="${x(iAg)}" y2="${M.t+PH}" stroke="#13233F" stroke-width="1.4"/>`;
    g += txt(x(iAg)+4, M.t+PH-6, LANG==="en"?"now":LANG==="es"?"ahora":"agora", {fs:9, b:1, c:"#13233F"});
  }

  const nt = HORIZ>72 ? 7 : 6;
  for(let i=0;i<=nt;i++){
    const idx = Math.round((H.length-1)*i/nt), X = x(idx), dd = new Date(H[idx].t);
    g += `<line x1="${X}" y1="${M.t+PH}" x2="${X}" y2="${M.t+PH+4}" stroke="#B9CCEA"/>`;
    g += txt(X, M.t+PH+15, dd.toLocaleDateString(LOC[LANG],{day:"2-digit",month:"2-digit"}), {a:"middle", fs:8.5});
    if(HORIZ<=72) g += txt(X, M.t+PH+26, dd.toLocaleTimeString(LOC[LANG],{hour:"2-digit",minute:"2-digit"}), {a:"middle", fs:8.5});
  }
  return g + "</svg>";
}

/* --- 8.5 chuva acumulada por site (barras 24 h e 72 h) --- */
function gChuva(){
  const dd = SITES.map(s=>({cod:s.cod, a24:acum(s.cod,24), a72:acum(s.cod,72), a168:acum(s.cod,168)}));
  const vMax = Math.max(10, Math.ceil(Math.max(...dd.map(d=>Math.max(d.a72||0, d.a168||0)))/10)*10);
  const W=880, H2=300, m={t:16,r:16,b:52,l:46};
  const pw=W-m.l-m.r, ph=H2-m.t-m.b;
  const bw = pw/dd.length;
  let g = `<svg viewBox="0 0 ${W} ${H2}" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">`;
  for(let i=0;i<=4;i++){
    const Y = m.t+ph*i/4;
    g += `<line x1="${m.l}" y1="${Y}" x2="${m.l+pw}" y2="${Y}" stroke="#EAF0FA"/>`;
    g += txt(m.l-6, Y+3, num(vMax*(4-i)/4,0), {a:"end", fs:9});
  }
  g += `<line x1="${m.l}" y1="${m.t+ph}" x2="${m.l+pw}" y2="${m.t+ph}" stroke="#1F3864"/>`;
  g += `<line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${m.t+ph}" stroke="#1F3864"/>`;
  g += txt(10, m.t+ph/2, "mm", {fs:9, b:1, c:"#1F3864"});
  dd.forEach((d,i)=>{
    const x0 = m.l+i*bw;
    const alt = v => v==null?0:(Math.min(v,vMax)/vMax)*ph;
    const h168 = alt(d.a168), h72 = alt(d.a72), h24 = alt(d.a24);
    // 7 dias em contorno tracejado: e dado de planejamento, nao de acionamento
    g += `<rect class="clr" x="${x0+bw*0.12}" y="${m.t+ph-h168}" width="${bw*0.24}" height="${h168}" fill="none" stroke="#6B7280" stroke-width="1" stroke-dasharray="3 2"/>`;
    g += `<rect class="clrf" x="${x0+bw*0.38}" y="${m.t+ph-h72}" width="${bw*0.24}" height="${h72}" fill="#B9CCEA"/>`;
    g += `<rect class="clrf" x="${x0+bw*0.64}" y="${m.t+ph-h24}" width="${bw*0.24}" height="${h24}" fill="#1F3864"/>`;
    g += txt(x0+bw/2, m.t+ph+14, d.cod.replace("01-02","PA"), {a:"middle", fs:8});
    if(d.a168!=null && d.a168>0) g += txt(x0+bw/2, m.t+ph-h168-4, num(d.a168,0), {a:"middle", fs:8.5, b:1, c:"#1F3864"});
  });
  g += `<rect x="${m.l}" y="${H2-24}" width="11" height="11" fill="#1F3864"/>`;
  g += txt(m.l+16, H2-15, "24 h", {fs:9.5, b:1, c:"#1F3864"});
  g += `<rect x="${m.l+58}" y="${H2-24}" width="11" height="11" fill="#B9CCEA"/>`;
  g += txt(m.l+74, H2-15, "72 h", {fs:9.5, b:1, c:"#1F3864"});
  g += `<rect x="${m.l+118}" y="${H2-24}" width="11" height="11" fill="none" stroke="#6B7280" stroke-dasharray="3 2"/>`;
  g += txt(m.l+134, H2-15, "7 d \u00b7 " + (LANG==="en"?"planning":LANG==="es"?"planificación":"planejamento"),
    {fs:9.5, b:1, c:"#6B7280"});
  return g + "</svg>";
}
function acum(cod, horas){
  const H = DADOS[cod]?.hora;
  if(!H || !H.length) return null;
  const lim = Date.now() + horas*3600*1000;
  return H.filter(h=>{ const t=new Date(h.t).getTime(); return t>=Date.now()-3600*1000 && t<=lim; })
          .reduce((a,h)=>a+(h.pr||0), 0);
}
function rajMax(cod, horas){
  const H = DADOS[cod]?.hora;
  if(!H || !H.length) return {v:null, t:null};
  const lim = Date.now() + horas*3600*1000;
  let best = {v:null, t:null};
  H.forEach(h=>{
    const t = new Date(h.t).getTime();
    if(t < Date.now()-3600*1000 || t > lim || h.raj==null) return;
    if(best.v==null || h.raj>best.v) best = {v:h.raj, t:h.t};
  });
  return best;
}

/* ---------------------------------------------- rev.08 FAIXA DE PAISES · rev.09 INDICADOR CIRCULAR
   ORDEM_PAIS — rev.11: ORDEM ALFABETICA ESTRITA, AR, BR, CL, MX, PE.
   SUPERA a sequencia da rev.08 (AR, BR, CL, PE, MX), que antepunha o Peru ao
   Mexico. A ordem alfabetica tem a virtude de ser IDENTICA nos tres idiomas
   do cockpit — PT Brasil/Mexico/Peru, ES Brasil/Mexico/Peru, EN
   Brazil/Mexico/Peru — de modo que uma unica sequencia estatica serve as tres
   versoes e dispensa justificativa perante auditor externo.

   Esta constante e a UNICA fonte de verdade da ordem: SITES, FONTES e a
   tabela de concentracao foram alinhadas a ela. Para restabelecer a sequencia
   da rev.08 basta reordenar as tres estruturas na mesma chave.

   nivelPais — consolida o pais pelo PIOR nivel entre os seus sites, com a
   mesma regra do cartao: pior(nivelVento(rajada), nivel do sismo mais forte).
   Nenhum limiar novo e introduzido. Site sem dado de rajada e sem sismo
   permanece "indef" e NAO e promovido a verde. */
const ORDEM_PAIS = ["AR","BR","CL","MX","PE"];

function nivelSitePainel(cod){
  const d = DADOS[cod]||{}, v = d.atual;
  const nv = v && v.rajada!=null ? nivelVento(v.rajada) : "indef";
  const sisF = (d.sismos||[]).reduce((a,b)=>(!a||(b.mag||0)>(a.mag||0))?b:a, null);
  if(nv==="indef" && !sisF) return "indef";
  return pior(nv==="indef"?"verde":nv, sisF?sisF.nivel:"verde");
}

function nivelPais(iso){
  const sites = SITES.filter(s=>s.iso===iso);
  let nv = "indef", comDado = 0;
  sites.forEach(s=>{
    const n = nivelSitePainel(s.cod);
    if(n!=="indef"){ comDado++; nv = pior(nv==="indef"?"verde":nv, n); }
  });
  return {nv: comDado? nv : "indef", comDado, total: sites.length};
}

/* =========================================================================
   MOTOR DE IMPRESSAO — A3 paisagem, uma pagina, escala MEDIDA
   Sequencia: medir a altura real do painel no layout de impressao; calcular a
   escala; se ficar abaixo do alvo, refluir a grade de cartoes para cinco
   colunas aproveitando a largura do A3; se ainda nao couber, reduzir ate o
   piso de legibilidade e DECLARAR o truncamento no rodape.
   Truncamento silencioso de registro de auditoria seria defeito de governanca.
   ========================================================================= */
function medirAltura(view){
  document.body.classList.add("prmeasure");
  const h = view.scrollHeight;
  document.body.classList.remove("prmeasure");
  return h;
}
function escalaDe(view){
  const h = medirAltura(view);
  return h > 0 ? Math.min(1, PR.H / h) : 1;
}

/* ajusteDe — logica de acomodacao comum a impressao unitaria e ao dossie:
   medir, refluir a grade para cinco colunas se compensar, e so entao reduzir
   ate o piso, truncando a maior tabela e DECLARANDO o truncamento. */
function ajusteDe(view){
  let esc = escalaDe(view), refluiu = false, trunc = null;

  if(esc < PR.ALVO && view.querySelector(".grid")){
    view.classList.add("cols5");
    refluiu = true;
    esc = escalaDe(view);
  }

  if(esc < PR.PISO){
    const tbs = [...view.querySelectorAll("table")]
      .filter(t=>t.tBodies[0] && t.tBodies[0].rows.length > 4);
    if(tbs.length){
      const t = tbs.reduce((a,b)=>b.tBodies[0].rows.length > a.tBodies[0].rows.length ? b : a);
      const linhas = [...t.tBodies[0].rows], total = linhas.length;
      let n = total, giros = 0;
      while(esc < PR.PISO && n > 4 && giros < 14){
        n = Math.max(4, Math.floor(n * 0.75));
        linhas.forEach((r,i)=>r.classList.toggle("prhide", i >= n));
        esc = escalaDe(view);
        giros++;
      }
      if(n < total) trunc = { n: n, total: total };
    }
  }

  return { esc: Math.max(PR.PISO, Math.min(1, esc)), refluiu: refluiu, trunc: trunc };
}

function limparImpressao(){
  document.documentElement.style.removeProperty("--pesc");
  document.querySelectorAll(".view").forEach(v=>{
    v.classList.remove("prtgt","cols5","ultima");
    v.style.removeProperty("--dz");
  });
  document.querySelectorAll("tr.prhide").forEach(r=>r.classList.remove("prhide"));
  document.querySelectorAll(".dhead").forEach(el=>el.remove());
  document.body.classList.remove("mono","dossie");
  ULTPR = null; DOSSIE = null;
  renderPrFoot();
}

function imprimir(alvo, mono){
  const view = document.querySelector('.view[data-v="' + alvo + '"]');
  if(!view) return;

  limparImpressao();
  document.body.classList.toggle("mono", !!mono);
  view.classList.add("prtgt");

  const a = ajusteDe(view);
  document.documentElement.style.setProperty("--pesc", a.esc.toFixed(4));
  ULTPR = { alvo: alvo, mono: !!mono, esc: a.esc, refluiu: a.refluiu, trunc: a.trunc };
  renderPrFoot();

  window.print();
  setTimeout(limparImpressao, 800);
}

/* =========================================================================
   rev.11 — DOSSIE COMPLETO
   Capa de controle + os seis paineis, sete folhas A3, uma unica operacao.
   Cada painel e medido e acomodado INDIVIDUALMENTE: uma folha densa nao
   impoe a sua reducao as demais. A escala vai para o proprio elemento, em
   --dz, e nao para o documento — e o que permite escalas distintas por folha.
   ========================================================================= */
const DOS_ORDEM = ["painel","sismos","meteo","limiares","registro","fontes"];

function imprimirDossie(mono){
  limparImpressao();
  document.body.classList.add("dossie");
  document.body.classList.toggle("mono", !!mono);

  const nomes = {painel:T().tabPainel, sismos:T().tabSismos, meteo:T().tabMeteo,
                 limiares:T().tabLimiares, registro:T().tabRegistro, fontes:T().tabFontes};
  const total = DOS_ORDEM.length + 1;
  const folhas = {}, ajustes = {};

  DOS_ORDEM.forEach((v,i)=>{
    const view = document.querySelector('.view[data-v="' + v + '"]');
    if(!view) return;
    const folha = i + 2;
    folhas[v] = folha;

    /* cabecalho corrido: cada folha se identifica sozinha, porque folhas
       avulsas circulam separadas do dossie que as originou */
    const dh = document.createElement("div");
    dh.className = "dhead";
    /* rev.14 — no cabecalho corrido o lettering permanece em NAVY: azul de
       marca sobre branco a 12 px em papel perde contraste. A identidade e
       dada pela capa; a folha avulsa precisa e de legibilidade. */
    dh.innerHTML = '<div class="dh-l">NextStream <em>· ' + esc(nomes[v]||v) + '</em></div>' +
      '<div class="dh-r">' + esc(T().capaFolha) + ' ' + folha + ' ' + esc(T().capaDe) + ' ' + total + '</div>';
    view.insertBefore(dh, view.firstChild);

    /* medicao exige o layout de impressao: prtgt e emprestado, medido e devolvido */
    view.classList.add("prtgt");
    ajustes[v] = ajusteDe(view);
    view.classList.remove("prtgt");
    view.style.setProperty("--dz", ajustes[v].esc.toFixed(4));
    if(i === DOS_ORDEM.length - 1) view.classList.add("ultima");
  });

  DOSSIE = { mono: !!mono, folhas: folhas, total: total, ajustes: ajustes };
  renderCapa();
  renderPrFoot();

  window.print();
  setTimeout(limparImpressao, 1200);
}

/* =========================================================================
   EXPORTACAO EM PPTX — A3 paisagem, uma folha, conteudo integro
   Escritor proprio (NSPPTX), sem biblioteca externa: o cockpit permanece
   autocontido. O slide TEM a dimensao da pagina, de modo que nenhum dialogo
   de navegador pode sobrepor-se — e a diferenca em relacao a impressao CSS.

   Restricao critica respeitada: em OOXML o atributo h de <a:tr> e altura
   MINIMA. Se a coluna for estreita, o texto quebra e a linha CRESCE,
   estourando a folha. Por isso cada conjunto de colunas declara a largura
   minima necessaria para NAO haver quebra, e ela escala com o corpo do texto.

   Escalonamento de reducao, sempre DECLARADO no rodape:
     1. completo  — nove colunas, observacao abreviada a 60 caracteres
     2. auditoria — oito colunas, observacao apenas no CSV
     3. compacto  — cinco colunas essenciais, tres omitidas
   Truncamento silencioso de linha nao ocorre em nenhuma hipotese.
   ========================================================================= */
const PX = { W: 396, H: 234, GAP: 6, WMAX: 200, X0: 12, Y0: 36 };
const PX_ESCADA = [[5.6, 6.5], [4.8, 5.5], [4.2, 5.0], [3.7, 4.5]];

/* A coluna do instante recebe 31 mm em vez de 27: a 5,5 pt, 27 mm cortariam os
   SEGUNDOS do horario. Perder o segundo em registro de auditoria e inaceitavel
   — o instante e elemento essencial da cadeia probatoria (clausula 11.3.1). */
function pxConjuntos(){
  const C = T().pxCab;
  return {
    completo:  { rot:[C[0],C[1],C[2],C[3],C[4],C[5],C[6],C[7],C[8]],
                 min:[6,31,21,29,19,14,31,23,45],
                 campos:["n","ts","site","tipo","nivel","valor","fonte","resp","obs"], omit:null },
    auditoria: { rot:[C[0],C[1],C[2],C[3],C[4],C[5],C[6],C[7]],
                 min:[6,31,21,29,19,14,31,23],
                 campos:["n","ts","site","tipo","nivel","valor","fonte","resp"], omit:[C[8]] },
    compacto:  { rot:[C[0],C[1],C[2],C[4],C[6]],
                 min:[6,31,21,19,31],
                 campos:["n","ts","site","nivel","fonte"], omit:[C[3],C[5],C[7],C[8]] },
  };
}

function pxPlanejar(n){
  const CJ = pxConjuntos();
  for(const chave of ["completo","auditoria","compacto"]){
    const C = CJ[chave];
    const base = C.min.reduce((a,b)=>a+b,0);
    for(const [hl,sz] of PX_ESCADA){
      const wMin = base*sz/6.5;
      const maxB = Math.floor((PX.W+PX.GAP)/(wMin+PX.GAP));
      const porB = Math.floor(PX.H/hl)-1;
      if(maxB<1 || porB<1) continue;
      const blocos = Math.max(1, Math.ceil(n/porB));
      if(blocos>maxB) continue;
      return { chave, C, blocos, porB, hl, sz, wMin,
               w: Math.min(PX.WMAX, (PX.W-(blocos-1)*PX.GAP)/blocos),
               cap: maxB*porB, umaFolha:true, legivel: sz>=5.0 };
    }
  }
  const C = CJ.compacto, [hl,sz] = PX_ESCADA[PX_ESCADA.length-1];
  const base = C.min.reduce((a,b)=>a+b,0), wMin = base*sz/6.5;
  const maxB = Math.floor((PX.W+PX.GAP)/(wMin+PX.GAP)), porB = Math.floor(PX.H/hl)-1;
  return { chave:"compacto", C, blocos:maxB, porB, hl, sz, wMin,
           w:(PX.W-(maxB-1)*PX.GAP)/maxB, cap:maxB*porB, umaFolha:false, legivel:false };
}

/* Limite de caracteres por coluna, derivado da largura EFETIVA e do corpo.
   Necessario porque h em <a:tr> e altura MINIMA: qualquer quebra de linha faz
   a linha crescer e a folha estourar.
   O fator 0,215 mm por ponto de corpo equivale a cerca de 0,61 em. E mais
   conservador que a largura media do Arial (~0,52 em) de proposito: os campos
   deste painel trazem muitas MAIUSCULAS (codigos de site, siglas de orgao),
   e maiuscula chega a 0,72 em. Subestimar aqui produz quebra de linha, e
   quebra de linha estoura a folha. */
function pxMaxCh(colMm, sz){
  return Math.max(6, Math.floor((colMm - 1.8) / (sz * 0.215)));
}
function pxCortar(txt, maxCh){
  const t = String(txt == null ? "" : txt);
  return t.length > maxCh ? t.slice(0, Math.max(1, maxCh - 1)) + "\u2026" : t;
}

function pxCelula(campo, r, n, mono, maxCh){
  const CORNVT = {verde:"2F5222", ambar:"8A5A0B", vermelho:"8B1A1A", critico:"13233F"};
  switch(campo){
    case "n":     return { t:String(n), algn:"ctr" };
    case "ts":    return { t:pxCortar(new Date(r.ts).toLocaleString(LOC[LANG]), maxCh) };
    case "site":  return { t:pxCortar(r.site, maxCh), b:1 };
    case "tipo":  return { t:pxCortar(T().tipos[r.tipo]||r.tipo, maxCh) };
    case "nivel": return { t:GLIFO[r.nivel]+" "+T().lvl[r.nivel], b:1,
                           cor: mono ? "000000" : (CORNVT[r.nivel]||"1A1A1A") };
    case "valor": return { t:pxCortar(r.valor, maxCh), algn:"ctr" };
    case "fonte": return { t:pxCortar(r.fonte, maxCh) };
    case "resp":  return { t:pxCortar(r.resp, maxCh) };
    case "obs":   return { t:pxCortar(r.obs, maxCh) };
    default:      return { t:"" };
  }
}

function pxFolha(pres, regs, mono, P, pag, tot, desloc){
  const mm = window.NSPPTX.mm;
  const s = pres.slide();
  const navy  = mono ? "000000" : "1F3864";
  const navyD = mono ? "000000" : "13233F";
  const cinza = mono ? "000000" : "6B7280";

  s.retangulo({ x:0, y:0, cx:window.NSPPTX.A3.cx, cy:mm(1.2), fundo:navy });
  s.texto([{t:"NEXTSTREAM", b:1, sz:13, cor:navyD},
           {t:"   |   Safety & Physical Security   |   Cockpit rev.21", sz:11, cor:cinza}],
    { x:mm(PX.X0), y:mm(8), cx:mm(240), cy:mm(6) });
  s.texto([{t:T().pxTit + (tot>1 ? "  ("+pag+" "+T().pxDe+" "+tot+")" : ""), b:1, sz:26, cor:navyD}],
    { x:mm(PX.X0), y:mm(15), cx:mm(260), cy:mm(12) });
  s.texto([{t:T().pxSub, sz:9, cor:"3A3A3A"}],
    { x:mm(PX.X0), y:mm(27), cx:mm(PX.W), cy:mm(6) });

  const soma = P.C.min.reduce((a,b)=>a+b,0);
  const COLMM = P.C.min.map(v=>P.w*v/soma);
  const LARG = COLMM.map(v=>mm(v));
  const MAXCH = COLMM.map(v=>pxMaxCh(v, P.sz));
  for(let b=0; b<P.blocos; b++){
    const fatia = regs.slice(b*P.porB, (b+1)*P.porB);
    if(!fatia.length) continue;
    const linhas = [P.C.rot.map((t,j)=>({t:pxCortar(t, MAXCH[j]), algn:"ctr"}))].concat(
      fatia.map((r,i)=>P.C.campos.map((c,j)=>
        pxCelula(c, r, desloc+b*P.porB+i+1, mono, MAXCH[j]))));
    s.tabela(linhas, {
      x: mm(PX.X0)+b*(mm(P.w)+mm(PX.GAP)), y: mm(PX.Y0),
      larguras: LARG, cy: mm(P.hl)*linhas.length, alturaLinha: mm(P.hl), sz: P.sz,
      fundoCab: mono?null:"D6E2F5", corCab: navyD,
      fundoPar: mono?null:"FBFCFE", fio: mono?"000000":"DDE3EE",
    });
  }

  const nesta = Math.min(regs.length, P.blocos*P.porB);
  let compl = T().pxIntegro + " \u2014 " + nesta + " " + T().pxLinhas + " " + P.blocos
    + " " + (P.blocos>1 ? T().pxBlocos : T().pxBloco);
  compl += " \u00b7 " + T().pxConj + " " + P.chave.toUpperCase();
  if(P.C.omit) compl += " \u00b7 " + T().pxOmit + ": " + P.C.omit.join(" \u00b7 ")
    + " (" + T().pxCsv + ")";
  const chObs = P.C.campos.indexOf("obs");
  if(chObs >= 0){
    const soma2 = P.C.min.reduce((a,b)=>a+b,0);
    compl += " \u00b7 " + T().pxAbrev + " "
      + pxMaxCh(P.w*P.C.min[chObs]/soma2, P.sz) + " " + T().pxCarac;
  }
  if(tot>1) compl += " \u00b7 " + T().pxFolha + " " + pag + " " + T().pxDe + " " + tot;

  s.retangulo({ x:mm(PX.X0), y:mm(277), cx:mm(PX.W), cy:mm(0.4), fundo:navy });
  s.texto([{t:T().pfTit + " \u00b7 " + T().pfPain + ": " + T().tabRegistro
    + " \u00b7 " + T().pfEm + ": " + new Date().toLocaleString(LOC[LANG])
    + " \u00b7 " + T().pfIdio + ": " + LANG.toUpperCase()
    + " \u00b7 " + T().pfPapel + ": " + T().pxPapel
    + " \u00b7 " + T().pfEsc + ": " + P.sz.toFixed(1) + " pt"
    + " \u00b7 " + T().pfModo + ": " + (mono?T().modoMono:T().modoCor)
    + " \u00b7 " + T().pfCompl + ": " + compl, sz:7, cor:"333333"}],
    { x:mm(PX.X0), y:mm(280), cx:mm(PX.W), cy:mm(5) });
  s.texto([{t:T().pfCav + (P.legivel ? "" : "  " + T().pxLegib), sz:7, b:1,
            cor: mono?"000000":"8B1A1A"}],
    { x:mm(PX.X0), y:mm(286), cx:mm(PX.W), cy:mm(5) });
  return s;
}

function exportarPptx(mono){
  if(!REGS.length){ aviso(T().pxVazio); return; }
  const P = pxPlanejar(REGS.length);
  const folhas = Math.max(1, Math.ceil(REGS.length/(P.blocos*P.porB)));
  const pres = new window.NSPPTX.Pres({ titulo:T().pxTit+" \u2014 NextStream",
                                        autor:"NextStream \u00b7 Safety & Physical Security" });
  for(let f=0; f<folhas; f++){
    const cap = P.blocos*P.porB;
    pxFolha(pres, REGS.slice(f*cap, (f+1)*cap), mono, P, f+1, folhas, f*cap);
  }
  const bytes = pres.bytes();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes],
    { type:"application/vnd.openxmlformats-officedocument.presentationml.presentation" }));
  a.download = "NEXTSTREAM_REGISTRO_A3" + (mono ? "_MONO" : "") + ".pptx";
  a.click();
  avisoDownload();   /* rev.21 */
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* =========================================================================
   rev.13 — CAPTURA DA PAGINA EM PNG
   Equivalente da "Captura da Web" do Edge, embutido no proprio arquivo.

   Por que NAO se usou html2canvas: sao ~200 KB de biblioteca de terceiro
   embutidos — o arquivo deixaria de ser autocontido em espirito — e ela
   reimplementa o motor de layout por conta propria, sendo notoriamente
   infiel a CSS Grid, a transform:scale e ao zoom que o dossie emprega.
   Validar folha a folha o que o proprio navegador ja sabe desenhar seria
   trabalho perdido.

   O caminho adotado e nativo: o documento e serializado dentro de um
   <foreignObject> de SVG, com a FOLHA DE ESTILO DO PROPRIO ARQUIVO embutida,
   e desenhado num canvas. Quem faz o layout e o motor do navegador — a
   fidelidade e, por construcao, a mesma da tela.

   ADVERTENCIA REGISTRADA: PNG e raster. O texto vira pixel — deixa de ser
   selecionavel, pesquisavel e indexavel, e serrilha ao ampliar. Para
   distribuicao e arquivo, o Dossie Completo continua sendo o instrumento
   correto: vetorial, resolucao independente de DPI. Esta captura serve a
   evidencia de tela e a comunicacao rapida, nao a documentacao controlada.

   Escala: 2x nominal (~192 DPI). Reduzida automaticamente se o canvas
   exceder o limite do navegador, e a escala EFETIVA vai no nome do arquivo,
   para que ninguem atribua a captura uma resolucao que ela nao tem.
   ========================================================================= */

/* =========================================================================
   rev.15 — CAPTURAR PAGINA EM PDF
   Mesmo enquadramento do PNG — scrollWidth x scrollHeight —, porem VETORIAL:
   o texto permanece texto, selecionavel e pesquisavel, e a nitidez independe
   de DPI. Esta e a diferenca em relacao ao PNG, e a razao de existirem os
   dois botoes em vez de um.

   TETO DE 200 POLEGADAS. O formato PDF limita a pagina a 200 in (~19.200 px
   a 96 dpi). Acima disso o navegador TRUNCA. Detecta-se antes e avisa-se o
   operador — entregar em silencio um PDF cortado seria defeito de governanca,
   e o mesmo criterio ja rege o truncamento de tabela no dossie.

   PAPEL SOB MEDIDA: honrado por Chrome e Edge. Firefox e Safari ignoram a
   diretiva @page e fatiam em A4 — a mesma restricao que o arquivo ja
   documenta para o A3 desde a rev.07.
   ========================================================================= */
function capturarPDF(){
  const bt = document.getElementById("btnPDF");
  const rot = bt ? bt.textContent : "";

  limparImpressao();

  const raiz = document.documentElement;
  /* recuo para a janela caso a medicao volte zerada: uma folha 0 x 0 seria
     aceita pela regra @page e o PDF sairia vazio, sem erro aparente */
  const W = Math.max(raiz.scrollWidth, document.body.scrollWidth, window.innerWidth  || 0, 800);
  const H = Math.max(raiz.scrollHeight, document.body.scrollHeight, window.innerHeight || 0, 600);

  if(H > PDF_MAXPX && !confirm(T().pdfAlto)) return;

  /* a folha so pode ser dimensionada com a pagina ja montada; por isso a
     regra @page e injetada agora e retirada ao fim */
  let st = document.getElementById("pgCaptura");
  if(!st){
    st = document.createElement("style");
    st.id = "pgCaptura";
    document.head.appendChild(st);
  }
  st.textContent = "@page{ size:" + W + "px " + Math.min(H, PDF_MAXPX) + "px; margin:0 }";

  document.body.classList.add("captura");
  if(bt){ bt.textContent = T().pdfProc; bt.disabled = true; }

  window.print();

  setTimeout(()=>{
    document.body.classList.remove("captura");
    const el = document.getElementById("pgCaptura");
    if(el) el.remove();
    if(bt){ bt.textContent = rot; bt.disabled = false; }
  }, 900);
}

const PNG_ESC = 2, PNG_MAXPX = 4.0e7, PNG_MAXLADO = 16384;

function nomeCaptura(esc){
  const d = new Date(), z = n => String(n).padStart(2,"0");
  return "COCKPIT_CLIMA_SISMO_LATAM_rev18_" + painelAtivo().toUpperCase() + "_" +
    d.getFullYear() + z(d.getMonth()+1) + z(d.getDate()) + "_" + z(d.getHours()) + z(d.getMinutes()) +
    "_" + esc.toFixed(1).replace(".",",") + "x.png";
}

async function capturarPNG(){
  const bt = document.getElementById("btnPNG");
  const rot = bt ? bt.textContent : "";
  if(bt){ bt.textContent = T().pngProc; bt.disabled = true; }

  try{
    const raiz = document.documentElement;
    const W = Math.max(raiz.scrollWidth, document.body.scrollWidth);
    const H = Math.max(raiz.scrollHeight, document.body.scrollHeight);

    /* escala efetiva: nunca prometer mais do que o canvas suporta */
    let esc = Math.min(PNG_ESC, Math.sqrt(PNG_MAXPX / (W * H)), PNG_MAXLADO / W, PNG_MAXLADO / H);
    /* o piso e 0,25 e NAO 1: numa pagina muito alta, forcar 1x estouraria o teto
       de 16384 px do canvas e a captura falharia por inteiro. Prefere-se
       entregar a imagem com escala reduzida e DECLARA-LA no nome do arquivo. */
    esc = Math.max(0.25, Math.floor(esc * 100) / 100);

    /* clone da pagina; o botao de captura sai da imagem — registrar o proprio
       ato de capturar seria ruido no documento capturado */
    const clone = document.body.cloneNode(true);
    clone.querySelectorAll("#btnPNG,#btnPDF").forEach(el=>el.remove());
    clone.querySelectorAll("dialog[open]").forEach(el=>el.removeAttribute("open"));

    const css = [...document.querySelectorAll("style")].map(x=>x.textContent).join("\n");

    const cx = document.createElement("div");
    cx.style.cssText = "width:" + W + "px; background:#fff";
    const st = document.createElement("style");
    st.textContent = css;
    cx.appendChild(st);
    while(clone.firstChild) cx.appendChild(clone.firstChild);

    /* O conteudo do <foreignObject> precisa declarar o espaco de nomes XHTML,
       sob pena de o SVG nao ser XML bem formado e a imagem nao carregar. Os
       serializadores atuais ja o emitem; declara-lo tambem aqui produziria
       atributo DUPLICADO e o mesmo erro de analise. Verifica-se e so entao
       se acrescenta. */
    let xhtml = new XMLSerializer().serializeToString(cx);
    if(!/^<div[^>]*\sxmlns=/.test(xhtml))
      xhtml = xhtml.replace(/^<div/, '<div xmlns="http://www.w3.org/1999/xhtml"');
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '">' +
      '<foreignObject width="100%" height="100%">' + xhtml + '</foreignObject></svg>';

    const img = new Image();
    await new Promise((ok, falha)=>{
      img.onload = ok;
      img.onerror = ()=>falha(new Error("SVG nao renderizou"));
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    });

    const cv = document.createElement("canvas");
    cv.width = Math.round(W * esc);
    cv.height = Math.round(H * esc);
    const g = cv.getContext("2d");
    g.fillStyle = "#FFFFFF";
    g.fillRect(0, 0, cv.width, cv.height);
    g.setTransform(esc, 0, 0, esc, 0, 0);
    g.drawImage(img, 0, 0);

    const blob = await new Promise(r=>cv.toBlob(r, "image/png"));
    if(!blob) throw new Error("toBlob vazio");

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nomeCaptura(esc);
    document.body.appendChild(a); a.click(); a.remove();
    avisoDownload();   /* rev.21 */
    setTimeout(()=>URL.revokeObjectURL(url), 4000);

    if(bt) bt.textContent = T().pngOk + " · " + esc.toFixed(1).replace(".",",") + "x";
    setTimeout(()=>{ if(bt) bt.textContent = rot; }, 2600);
  }catch(e){
    console.error("captura:", e);
    aviso(T().pngErr);
    if(bt) bt.textContent = rot;
  }finally{
    if(bt) bt.disabled = false;
  }
}

function tick(){
  /* rev.19 — data em ISO 8601 (ABNT NBR ISO 8601) e hora em hNNmin.
     Grafia unica nos tres idiomas. */
  const d = new Date();
  document.getElementById("clock").textContent = hdData(d) + " " + hdHora(d);
}

/* ---------------------------------------------- 12. INICIALIZACAO */
(async function init(){
  render();
  await carregarRegs(); renderRegs();
  /* rev.10 — cadencia de um segundo: alimenta relogio e contagem regressiva.
     Custo desprezivel, apenas dois nos de texto atualizados. */
  tick(); renderCiclo(); setInterval(()=>{ tick(); renderCiclo(); }, 1000);
  /* rev.10 — o involucro coletar() ja trata excecao e agenda o proximo ciclo
     no bloco finally; setInterval foi substituido por temporizador encadeado. */
  await coletar();
})();
</script>
