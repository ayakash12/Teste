<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextStream | Cockpit de Monitoramento Climático e Sísmico LATAM — rev.21</title>
<style>
/* =========================================================================
   PALETA rev.02, mantida na rev.10 — BAIXA COBERTURA DE TINTA COLORIDA
   A cor migra do preenchimento de área para o texto, o fio fino e o chip
   pequeno. Fundo branco. Blocos em azul-claro. Âmbar e vermelho aparecem
   apenas em chip de nível — isto é, só quando há efetivamente alerta.
   ========================================================================= */
:root{
  --navy:#1F3864; --navy-d:#13233F;
  --blue1:#EAF0FA; --blue2:#D6E2F5; --blue3:#B9CCEA;
  --amber:#E8A33D; --red:#C0392B; --green:#4F7942;
  --grey:#6B7280; --grey-l:#9AA3B2; --line:#DDE3EE; --white:#fff;
  --amb-t:#8A5A0B; --red-t:#8B1A1A; --grn-t:#2F5222;
  /* rev.14 — AZUL DE MARCA. Amostrado do logotipo oficial fornecido pela
     Diretoria. Nao entra na codificacao de risco: verde, ambar e vermelho
     seguem reservados a NIVEL, e o azul de marca nunca e usado para dado. */
  --brand:#3085F0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Artifakt Element','Segoe UI',Arial,Helvetica,sans-serif;
  background:var(--white); color:#1A1A1A; font-size:14px; line-height:1.5}

/* ---------- cabeçalho: branco com fio navy, sem sangria de cor ---------- */
header{background:var(--white); border-bottom:2px solid var(--navy); padding:14px 24px}
.hd-top{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
/* --- marca: marcador vetorial + nome, ambos em navy (sem laranja) --- */
.brandbox{display:flex; align-items:center; gap:7px}
.mark{display:inline-flex; color:var(--brand); line-height:0}
.mark svg{height:26px; width:auto; display:block}
/* rev.14 — o lettering deixa a caixa-alta espacada e assume a forma do
   logotipo: NextStream, caixa mista, azul de marca, espacejamento fechado. */
.brand{font-size:21px; font-weight:800; letter-spacing:-.012em; color:var(--brand)}

/* --- bandeira + codigo ISO: identificacao redundante do pais --- */
.flag{display:inline-flex; line-height:0; vertical-align:middle}
.flag svg{height:14px; width:21px; display:block}
.iso{display:inline-block; padding:0 4px; border:1px solid var(--blue3); border-radius:3px;
  font-size:9px; font-weight:800; letter-spacing:.06em; color:var(--navy); background:var(--white);
  line-height:14px; vertical-align:middle}
.c-id{display:flex; align-items:center; gap:6px}
/* bandeira em celula de tabela: coluna estreita, sem chip.
   Na impressao monocromatica a bandeira colapsa e o codigo ISO assume, de modo
   que a coluna NUNCA fica vazia. */
td.bnd{text-align:center; white-space:nowrap; padding:5px 6px}
td.bnd .flag{vertical-align:middle}
.isoP{display:none; font-size:9.5px; font-weight:800; letter-spacing:.06em; color:var(--navy)}
/* =========================================================================
   rev.09 — FAIXA DE PAISES: INDICADOR CIRCULAR DE NIVEL
   O nivel consolidado do pais deixa de circundar a bandeira e passa a um
   INDICADOR PROPRIO — bolinha posicionada acima da bandeira. A bandeira
   volta a exercer funcao unica de identificacao de pais, com fio cinza
   neutro de 1 px, igual para os cinco. As cinco bolinhas alinham-se em
   regua horizontal, de modo que os cinco paises se comparam num relance.

   Nivel consolidado do pais = PIOR nivel entre os sites daquele pais. Nao se
   cria limiar novo: o nivel de cada site permanece funcao exclusiva da rajada
   (clausula 8.1) e do sismo (clausula 8.2), de modo que a bolinha jamais
   discorda do chip do cartao.

   CODIFICACAO REDUNDANTE MANTIDA: cor da bolinha + FORMA da bolinha + glifo
   + codigo ISO. Bolinha colorida isolada nao sobrevive a fotocopia
   monocromatica nem a deficiencia de percepcao de cor. Sem dado NAO recebe
   verde — recebe bolinha vazada de fio tracejado, pois verde sobre dado
   indisponivel seria falsa garantia.
   ========================================================================= */
.flagbar{display:flex; justify-content:flex-end; align-items:flex-end; gap:11px;
  width:100%; margin-top:9px; flex-wrap:wrap}
.flagbar .fb-t{font-size:9.5px; font-weight:700; letter-spacing:.05em; color:var(--grey);
  text-transform:uppercase; margin-right:2px; padding-bottom:3px}
.fgi{display:flex; flex-direction:column; align-items:center; gap:3px}

/* indicador circular de nivel — acima da bandeira, sem encobri-la */
.fgi .fg-d{width:12px; height:12px; border-radius:50%; display:block;
  border:2px solid var(--grey-l); background:var(--white); box-sizing:border-box}

/* bandeira: sem moldura de nivel. O contorno e o fio cinza neutro que o
   proprio SVG da bandeira ja carrega (constante FIO), identico para os cinco
   paises — evita-se assim linha dupla. NENHUMA cor de nivel circunda a
   bandeira. */
.fgi .fg-w{padding:0; border:0; background:var(--white);
  line-height:0; display:inline-flex}
.fgi .fg-w svg{height:20px; width:30px; display:block}

.fgi .fg-l{display:flex; align-items:center; gap:3px; font-size:9px; font-weight:800;
  letter-spacing:.06em; color:var(--navy); line-height:1.1}
.fgi .fg-l .g{font-size:9.5px; line-height:1}

/* Cores da paleta homologada. A FORMA acompanha a cor: solida, anel, solida
   com anel externo, tracejada — a distincao persiste sem cor. */
.fg-verde    .fg-d{background:var(--green); border-color:var(--green)}
.fg-verde    .fg-l{color:var(--grn-t)}
.fg-ambar    .fg-d{background:var(--amber); border-color:var(--amb-t)}
.fg-ambar    .fg-l{color:var(--amb-t)}
.fg-vermelho .fg-d{background:var(--red); border-color:var(--red-t)}
.fg-vermelho .fg-l{color:var(--red-t)}
/* critico: navy escuro solido com anel externo, em paridade com o chip
   .ch-critico do painel. Divergir da paleta homologada seria defeito
   visivel em instrumento levado ao Board. */
.fg-critico  .fg-d{background:var(--navy-d); border-color:var(--navy-d);
  box-shadow:0 0 0 2px var(--white), 0 0 0 4px var(--navy-d); margin-bottom:3px}
.fg-critico  .fg-l{color:var(--navy-d)}
.fg-indef    .fg-d{background:var(--white); border-style:dashed; border-color:var(--grey-l)}
.fg-indef    .fg-l{color:var(--grey)}
.hd-div{width:1px; height:26px; background:var(--blue3)}
.hd-title{font-size:14px; font-weight:700; color:var(--navy-d)}
.hd-sub{font-size:11.5px; color:var(--grey); margin-top:2px}
.spacer{flex:1}
.langs{display:flex; gap:4px}
.langs button{background:var(--white); border:1px solid var(--blue3); color:var(--navy);
  padding:5px 12px; border-radius:4px; cursor:pointer; font-size:11.5px; font-weight:700;
  letter-spacing:.05em; font-family:inherit}
.langs button.on{background:var(--blue2); border-color:var(--navy); color:var(--navy-d)}
.btn{background:var(--white); color:var(--navy-d); border:1px solid var(--navy); padding:7px 14px;
  border-radius:4px; font-weight:700; font-size:12px; cursor:pointer; font-family:inherit}
.btn:hover{background:var(--blue1)}
.btn.pri{background:var(--blue2); border-color:var(--navy)}
.btn.sm{padding:5px 11px; font-size:11px}
.clock{font-size:11.5px; color:var(--grey); text-align:right; line-height:1.45}

/* ---------- navegação: branco, aba ativa com fio âmbar ---------- */
nav{background:var(--white); border-bottom:1px solid var(--line); display:flex;
  padding:0 24px; overflow-x:auto}
nav button{background:transparent; border:0; border-bottom:3px solid transparent; color:var(--grey);
  padding:11px 15px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;
  font-family:inherit}
nav button.on{color:var(--navy-d); border-bottom-color:var(--amber); font-weight:800}
nav .gl{font-size:11px; margin-right:5px}

main{padding:20px 24px 44px; max-width:1620px; margin:0 auto}
.view{display:none} .view.on{display:block}

/* ---------- avisos: fio grosso à esquerda, fundo quase branco ---------- */
.notice{background:#FFFDF7; border:1px solid var(--amber); border-left:5px solid var(--amber);
  border-radius:4px; padding:11px 15px; margin-bottom:16px}
.notice.rd{background:#FFFAFA; border-color:var(--red); border-left-color:var(--red)}
.notice.bl{background:var(--blue1); border-color:var(--blue3); border-left-color:var(--navy)}
.notice h4{font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--amb-t); margin-bottom:4px}
.notice.rd h4{color:var(--red-t)} .notice.bl h4{color:var(--navy-d)}
.notice p{font-size:12.5px; color:#3A3A3A}
.notice ul{margin:5px 0 0 17px; font-size:12.5px; color:#3A3A3A}
.notice li{margin-bottom:3px}

/* ---------- indicadores ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:18px}
.kpi{background:var(--white); border:1px solid var(--blue3); border-radius:5px; padding:12px 14px}
.kpi .lb{font-size:10px; font-weight:700; letter-spacing:.07em; color:var(--grey); text-transform:uppercase}
.kpi .vl{font-size:27px; font-weight:800; color:var(--navy-d); margin-top:4px; line-height:1}
.kpi .ft{font-size:10.5px; color:var(--grey); margin-top:4px}
.kpi.a{background:#FFFDF7} .kpi.a .vl{color:var(--amb-t)}
.kpi.r{background:#FFFAFA} .kpi.r .vl{color:var(--red-t)}
.kpi.g .vl{color:var(--grn-t)}

.secttl{font-size:12.5px; font-weight:800; letter-spacing:.07em; color:var(--navy-d);
  text-transform:uppercase; margin:20px 0 11px; padding-bottom:5px; border-bottom:1px solid var(--blue3)}
.secttl:first-child{margin-top:0}

/* ---------- cartões de site: fio azul-claro, sem faixa de cor ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:13px}
.card{background:var(--white); border:1px solid var(--blue3); border-radius:6px; overflow:hidden}
.card.al{border-color:var(--amber); border-width:2px}
.card.rl{border-color:var(--red); border-width:2px}
.c-hd{padding:11px 14px 9px; border-bottom:1px solid var(--line); background:var(--blue1)}
.c-cd{font-size:15px; font-weight:800; color:var(--navy-d); letter-spacing:.03em; line-height:1.1}
.c-lo{font-size:11px; color:var(--grey); margin-top:1px}

/* ---------- rev.11 LINHA DE ENDERECO + SETA PARA O MAPA ----------
   O endereco desce para o cabecalho do cartao, sob a localidade, e deixa a
   linha de coordenadas — onde a rev.10 o anexava ao horario de leitura e ele
   se confundia com dado de telemetria. A seta e discreta por decisao: ela e
   uma comodidade de navegacao, nao um dado de monitoramento, e nao deve
   competir com o chip de nivel. Suprimida na impressao: hyperlink em papel
   nao e acionavel e so consome tinta.

   rev.12 — a seta cede lugar a um icone de mapa dobrado com pino, desenhado
   em SVG proprio. NAO se reproduz o icone de banco de imagens: alem da
   licenca de terceiro, um arquivo externo quebraria a propriedade
   autocontida. A paleta tambem e deliberada — pino AMBAR sobre mapa NAVY, e
   nao o vermelho da referencia: neste cockpit vermelho e verde sao NIVEIS DE
   RISCO, e dez pinos vermelhos permanentes seriam dez falsos alertas ao lado
   do chip de nivel. Altura de 13 px, contra os 14 px da bandeira e da caixa
   do acronimo, para que o conjunto do cabecalho leia como uma so linha. */
.c-end{font-size:9.5px; color:var(--grey); margin-top:3px; line-height:1.35;
  max-width:36ch; text-wrap:pretty}
.c-map{display:inline-block; margin-left:4px; line-height:0; vertical-align:-2px;
  color:var(--navy); text-decoration:none; opacity:.62;
  transition:opacity .15s ease, transform .15s ease}
.c-map svg{height:13px; width:13px; display:block}
.c-map:hover,.c-map:focus-visible{opacity:1; transform:translateY(-1.5px)}
.c-map:focus-visible{outline:2px solid var(--amber); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion:reduce){ .c-map{transition:none} }
.c-bd{padding:12px 14px}

/* ---------- CHIP DE NÍVEL: codificação redundante cor + glifo + rótulo ---------- */
.chip{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:10px;
  font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; border:1.5px solid}
.chip .g{font-size:10px; line-height:1}
.ch-verde{color:var(--grn-t); border-color:var(--green); background:#F3F8F1}
.ch-ambar{color:var(--amb-t); border-color:var(--amber); background:#FFF8EA}
.ch-vermelho{color:var(--red-t); border-color:var(--red); background:#FDF0EF}
.ch-critico{color:var(--white); border-color:var(--navy-d); background:var(--navy-d)}
.ch-indef{color:var(--grey); border-color:var(--blue3); background:var(--white)}
.chip.out{color:var(--navy); border-color:var(--blue3); background:var(--white); font-weight:700}

.mets{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:10px}

/* ---------- BADGE DE INDICE UV — rev.07 ----------------------------------
   DELIBERADAMENTE DISTINTO do chip de nivel (.chip / .ch-*). O chip exprime
   nivel de ACIONAMENTO, lastreado nas clausulas 8.1 e 8.2 da ESP-PSS-090.
   O UV nao possui limiar homologado: e indicador de PLANEJAMENTO. Confundir
   os dois seria conferir ao UV uma autoridade normativa que ele nao tem.
   Por isso: forma retangular (nao pilula), glifo de preenchimento progressivo
   (nao o par forma/glifo do semaforo) e fio lateral espesso a esquerda.
   Escala cromatica OMS/WMO — o violeta do nivel extremo e a unica cor deste
   cockpit fora da paleta corporativa, adotada por ser padrao internacional
   de reconhecimento imediato. ------------------------------------------- */
.uvb{display:inline-flex; align-items:center; gap:5px; padding:1px 7px 1px 5px;
  border:1px solid var(--line); border-left-width:4px; border-radius:2px;
  font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
  background:var(--white); margin-top:3px}
.uvb .g{font-size:10px; line-height:1}
.uv-uv1{border-left-color:#4F7942; color:var(--grn-t)}
.uv-uv2{border-left-color:#E8A33D; color:var(--amb-t)}
.uv-uv3{border-left-color:#D4761F; color:#8A4A0B}
.uv-uv4{border-left-color:#C0392B; color:var(--red-t)}
.uv-uv5{border-left-color:#6B3FA0; color:#4A2A70}
.uv-indef{border-left-color:var(--blue3); color:var(--grey)}

/* ---------- rev.20  2A · INDICADOR CIRCULAR DE NIVEL NO CARTAO ----------
   Replica a gramatica do indicador .fg-d da faixa de paises (rev.09): mesmo
   diametro, mesmo fio, mesma paleta homologada, mesmas regras de impressao
   monocromatica. NENHUMA semantica nova e introduzida — a bolinha do cartao
   exprime o MESMO nivel consolidado que o chip do canto superior direito do
   proprio cartao e que a bolinha do pais na faixa superior. Redundancia
   deliberada: o operador que le a faixa de paises encontra no cartao o mesmo
   sinal na mesma forma, sem reaprender codificacao.
   A distincao NAO depende da cor — a forma acompanha: solida, anel, solida
   com anel externo, tracejada. O glifo textual permanece no chip ao lado.
   DELIBERADAMENTE NAO exprime criticidade de ativo: um sitio classificado
   como Critico em tempo bom nao pode ostentar marcador vermelho. Ver .crt-*
   abaixo, que carrega essa outra grandeza em gramatica propria. -------- */
.c-dot{width:12px; height:12px; border-radius:50%; display:block; flex:0 0 auto;
  border:2px solid var(--grey-l); background:var(--white); box-sizing:border-box}
.cd-verde    .c-dot{background:var(--green);  border-color:var(--green)}
.cd-ambar    .c-dot{background:var(--amber);  border-color:var(--amb-t)}
.cd-vermelho .c-dot{background:var(--red);    border-color:var(--red-t)}
.cd-critico  .c-dot{background:var(--navy-d); border-color:var(--navy-d);
  box-shadow:0 0 0 2px var(--white), 0 0 0 4px var(--navy-d); margin-right:3px}
.cd-indef    .c-dot{background:var(--white); border-style:dashed; border-color:var(--grey-l)}

/* ---------- rev.20  3A · CLASSIFICACAO DE CRITICIDADE DO ATIVO ----------
   GRANDEZA DISTINTA do nivel de acionamento. A criticidade e atributo
   ESTATICO de patrimonio, definido em cadastro; o nivel e estado DINAMICO,
   funcao das clausulas 8.1 e 8.2. Confundi-los faria um sitio classificado
   como Critico parecer em acionamento critico permanente — defeito grave em
   instrumento levado ao Board.
   Por isso adota-se aqui o mesmo precedente ja homologado nesta pasta para o
   badge UV (rev.07): forma RETANGULAR, nao pilula, e fio lateral espesso a
   esquerda. A pilula (.chip / .ch-*) permanece reservada, com exclusividade,
   ao nivel de acionamento.
   Cromatica sobria e de baixa cobertura de tinta, coerente com a paleta da
   rev.02. Duas faixas apenas — Alta e Critica — porque o cadastro so
   reconhece duas. O rotulo textual acompanha a cor: sobrevive ao
   monocromatico e a deficiencia de percepcao cromatica. ---------------- */
.crt{display:inline-flex; align-items:center; gap:5px; padding:1px 7px 1px 5px;
  border:1px solid var(--line); border-left-width:4px; border-radius:2px;
  font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
  background:var(--white)}
.crt .g{font-size:9.5px; line-height:1}
.crt-alta{border-left-color:#C08A2E; color:#8A5A0B}
.crt-critica{border-left-color:var(--navy-d); color:var(--navy-d)}

/* nota de planejamento sob a legenda de UV */
.uvnota{font-size:10.5px; color:var(--grey); margin:-4px 0 12px 0; line-height:1.45}
.uvnota b{color:var(--amb-t); font-weight:800}
.met{background:var(--blue1); border-radius:4px; padding:8px 9px}
.met .ml{font-size:9px; font-weight:700; letter-spacing:.06em; color:var(--grey); text-transform:uppercase}
.met .mv{font-size:18px; font-weight:800; color:var(--navy-d); margin-top:1px; line-height:1.1}
.met .mu{font-size:10px; font-weight:600; color:var(--grey)}
.met .mf{font-size:9px; font-weight:700; color:var(--amb-t); margin-top:2px;
  letter-spacing:.04em; text-transform:uppercase}
.act{margin-top:10px; padding:8px 10px; background:var(--white); border:1px solid var(--line);
  border-left:3px solid var(--navy); border-radius:0 4px 4px 0; font-size:11.5px; color:#3A3A3A}
.act b{display:block; font-size:9px; letter-spacing:.06em; color:var(--navy);
  text-transform:uppercase; margin-bottom:2px}
.coord{font-size:10px; color:var(--grey); margin-top:8px; font-variant-numeric:tabular-nums}
.coord em{color:var(--amb-t); font-style:normal; font-weight:700}

/* --- rodape de fontes do cartao: operacionaliza a etapa de confirmacao (5.3) --- */
.src{margin-top:10px; border-top:1px solid var(--line); padding-top:8px}
.src-h{display:flex; align-items:center; justify-content:space-between; gap:6px;
  font-size:9px; font-weight:800; letter-spacing:.06em; color:var(--navy);
  text-transform:uppercase; cursor:pointer; user-select:none}
.src-h .tog{font-size:10px; color:var(--grey)}
.src-b{margin-top:6px}
.src.fold .src-b{display:none}
.src-i{display:flex; align-items:baseline; gap:5px; padding:2px 0; font-size:10.5px; line-height:1.35}
.src-i .lb{flex:0 0 62px; font-size:8.5px; font-weight:800; letter-spacing:.04em;
  color:var(--grey); text-transform:uppercase}
.src-i a{color:var(--navy); font-weight:700; text-decoration:none; border-bottom:1px solid var(--blue3)}
.src-i a:hover{background:var(--blue1)}
.src-i .dom{color:var(--grey-l); font-size:9.5px}
.src-cav{margin-top:5px; font-size:8.5px; font-weight:700; letter-spacing:.04em;
  color:var(--amb-t); text-transform:uppercase}

/* ---------- tabelas: cabeçalho azul-claro, texto navy ---------- */
table{width:100%; border-collapse:collapse; background:var(--white); font-size:12.5px}
th{background:var(--blue2); color:var(--navy-d); padding:8px 10px; text-align:left; font-size:10px;
  font-weight:800; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap;
  border-bottom:1px solid var(--blue3)}
td{padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top}
tbody tr:nth-child(even){background:#FBFCFE}
.tw{overflow-x:auto; border:1px solid var(--blue3); border-radius:5px; margin-bottom:6px}
.nm{font-variant-numeric:tabular-nums; white-space:nowrap}

.lgd{display:flex; gap:12px; align-items:center; margin-bottom:11px; flex-wrap:wrap}
.lgi{display:flex; align-items:center; gap:5px; font-size:11px; color:#3A3A3A}

.empty{padding:30px; text-align:center; color:var(--grey); font-size:13px;
  background:var(--blue1); border:1px dashed var(--blue3); border-radius:5px}
.bar{display:flex; gap:8px; align-items:center; margin-bottom:13px; flex-wrap:wrap}
.bar label{font-size:11px; font-weight:700; color:var(--grey); text-transform:uppercase; letter-spacing:.04em}
select,input{font-family:inherit; font-size:12.5px; padding:6px 9px; border:1px solid var(--blue3);
  border-radius:4px; background:var(--white); color:#1A1A1A}
.st{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--grey)}
.dot{width:8px; height:8px; border-radius:50%; background:var(--grey-l)}
.dot.ok{background:var(--green)} .dot.er{background:var(--red)} .dot.wk{background:var(--amber)}

/* ---------- segmentado (janela de tempo / vista) ---------- */
.seg{display:inline-flex; border:1px solid var(--blue3); border-radius:5px; overflow:hidden}
.seg button{background:var(--white); border:0; border-right:1px solid var(--blue3); color:var(--navy);
  padding:6px 13px; font-size:11.5px; font-weight:700; cursor:pointer; font-family:inherit}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue2); color:var(--navy-d)}

.tarja{display:inline-block; margin-left:8px; padding:1px 7px; border:1px solid var(--amber);
  border-radius:3px; background:#FFFDF7; font-size:9px; font-weight:800; letter-spacing:.04em;
  color:var(--amb-t); text-transform:uppercase; vertical-align:middle}
.chart{background:var(--white); border:1px solid var(--blue3); border-radius:5px; padding:10px;
  margin-bottom:14px; overflow-x:auto}
.chart svg{display:block; width:100%; height:auto; min-width:520px}
.chnote{font-size:10.5px; color:var(--grey); font-style:italic; margin-top:5px; padding:0 4px}

.two{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media(max-width:1080px){.two{grid-template-columns:1fr}}

/* ---------- modal ---------- */
.mask{display:none; position:fixed; inset:0; background:rgba(19,35,63,.5); z-index:60;
  align-items:center; justify-content:center; padding:20px}
.mask.on{display:flex}
.modal{background:var(--white); border-radius:6px; max-width:560px; width:100%; max-height:88vh;
  overflow-y:auto; border:1px solid var(--navy)}
.m-hd{background:var(--blue2); color:var(--navy-d); padding:13px 18px; font-size:14px; font-weight:800;
  display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--navy)}
.m-hd button{background:transparent; border:0; color:var(--navy-d); font-size:20px; cursor:pointer; line-height:1}
.m-bd{padding:18px}
.fld{margin-bottom:12px}
.fld label{display:block; font-size:10.5px; font-weight:700; letter-spacing:.05em; color:var(--grey);
  text-transform:uppercase; margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%; font-family:inherit; font-size:13px; padding:8px 10px;
  border:1px solid var(--blue3); border-radius:4px}
.fld textarea{min-height:64px; resize:vertical}
.m-ft{padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end}
.hint{font-size:10.5px; color:var(--grey); margin-top:3px}

footer{background:var(--white); border-top:1px solid var(--blue3); color:var(--grey); padding:13px 24px;
  font-size:10.5px; display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap}

/* ---------- rodapé de governança: só na impressão ---------- */
.prfoot{display:none}

/* =========================================================================
   IMPRESSÃO — A3 PAISAGEM, UMA PÁGINA, ESCALA MEDIDA (rev.07)

   Dois botões explícitos por painel: COLORIDO e MONOCROMÁTICO. O seletor de
   modo foi removido — criava estado oculto e persistente entre painéis, sem
   confirmação visual na tela do modo vigente.

   A diretiva de papel é uma SOLICITAÇÃO: honrada por Chrome e Edge, ignorada
   pelo Firefox (prevalece o diálogo) e largamente pelo Safari. O rodapé de
   governança registra o papel efetivamente usado.

   A classe .prmeasure reproduz na tela o layout de impressão para que o JS
   possa MEDIR a altura real antes de calcular a escala.
   ========================================================================= */
@page{ size:A3 landscape; margin:8mm; }

/* --- regras comuns a impressão e a medição --- */
@media print{
  *{-webkit-print-color-adjust:exact !important; print-color-adjust:exact !important}
  nav,.langs,.btn,.bar,.mask,.clock,footer,.src-h .tog{display:none !important}
  .c-map{display:none !important}   /* rev.11 — link nao e acionavel em papel */
  header{border-bottom:2px solid var(--navy); padding:0 0 6px}
  main{padding:0; max-width:none}
  body{font-size:10.5px}
  .view{display:none !important}
  .view.prtgt{display:block !important; width:1527px;
    transform:scale(var(--pesc,1)); transform-origin:top left}
  .view.cols5 .grid{grid-template-columns:repeat(5,1fr) !important}
  .grid{grid-template-columns:repeat(3,1fr)}
  .card,.kpi,.tw,table,.chart,.notice{page-break-inside:avoid; break-inside:avoid}
  .chart svg{min-width:0}
  .src.fold .src-b{display:block}
  tr.prhide{display:none !important}
  .prfoot{display:block !important; margin-top:10px; padding-top:6px;
    border-top:1px solid var(--navy); font-size:8.5px; color:#333; line-height:1.45}
  .prfoot b{color:var(--navy-d)}
  .prfoot .cav{color:var(--red-t); font-weight:700}
}

/* =========================================================================
   rev.11 — DOSSIE COMPLETO: sete folhas A3 numa unica operacao
   Capa de controle + os seis paineis, cada um numa folha propria.

   Por que ZOOM e nao TRANSFORM: transform:scale nao altera a caixa de
   layout — o painel reduzido continuaria a ocupar a altura original e a
   quebra de pagina cairia no lugar errado, gerando folhas em branco. A
   propriedade zoom reduz a caixa de fato, de modo que cada painel ocupa
   exatamente uma folha. Honrada por Chrome e Edge, que sao os motores em
   que a diretiva @page tambem e honrada; a impressao painel a painel
   permanece em transform e inalterada.
   ========================================================================= */
.capa{display:none}
@media print{
  body.dossie header,body.dossie nav,body.dossie footer{display:none !important}
  body.dossie .capa{display:block !important; break-after:page; page-break-after:always}
  body.dossie .view{display:block !important; width:1527px; transform:none !important;
    zoom:var(--dz,1); break-after:page; page-break-after:always}
  body.dossie .view.ultima{break-after:auto; page-break-after:auto}
  body.dossie .dhead{display:flex !important}
}
body.prmeasure .dhead{display:flex !important}
.dhead{display:none; align-items:baseline; justify-content:space-between; gap:12px;
  border-bottom:2px solid var(--navy); padding-bottom:5px; margin-bottom:10px}
.dhead .dh-l{font-size:12px; font-weight:800; letter-spacing:.05em; color:var(--navy-d)}
.dhead .dh-l em{font-style:normal; font-weight:600; color:var(--grey); letter-spacing:0}
.dhead .dh-r{font-size:9.5px; color:var(--grey); font-variant-numeric:tabular-nums}

/* ---------- CAPA DE CONTROLE ---------- */
.cp-top{display:flex; align-items:center; gap:10px; border-bottom:2px solid var(--navy);
  padding-bottom:10px}
.cp-top .mark{color:var(--brand)}
.cp-top .brand{font-size:22px}
.cp-top .cp-dir{margin-left:auto; font-size:10px; color:var(--grey); text-align:right; line-height:1.5}
.cp-ttl{font-size:34px; font-weight:800; color:var(--navy-d); letter-spacing:-.01em;
  line-height:1.12; margin:34px 0 6px}
.cp-sub{font-size:13px; color:var(--grey); margin-bottom:26px}
.cp-rule{height:4px; background:var(--amber); width:88px; margin-bottom:26px}
.cp-meta{display:grid; grid-template-columns:repeat(3,1fr); gap:10px 26px; margin-bottom:26px}
.cp-meta div{border-top:1px solid var(--line); padding-top:5px}
.cp-meta .k{font-size:8.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  color:var(--grey)}
.cp-meta .v{font-size:12px; font-weight:700; color:var(--navy-d); font-variant-numeric:tabular-nums}
.cp-cols{display:grid; grid-template-columns:1fr 1.35fr; gap:34px}
.cp-h{font-size:9px; font-weight:800; letter-spacing:.11em; text-transform:uppercase;
  color:var(--navy); border-bottom:1.5px solid var(--navy); padding-bottom:4px; margin-bottom:9px}
.cp-sum{list-style:none; margin:0; padding:0}
.cp-sum li{display:flex; gap:9px; font-size:11.5px; color:var(--navy-d); padding:4px 0;
  border-bottom:1px dotted var(--blue3)}
.cp-sum b{font-variant-numeric:tabular-nums; color:var(--amb-t); min-width:16px}
.cp-sit{columns:2; column-gap:22px; font-size:10px; line-height:1.5}
.cp-sit .pa{font-weight:800; color:var(--navy); letter-spacing:.05em; text-transform:uppercase;
  font-size:8.5px; margin-top:7px; break-after:avoid}
.cp-sit .si{color:var(--grey); break-inside:avoid; padding-left:1px}
.cp-sit .si b{color:var(--navy-d); font-weight:700}
.cp-nota{margin-top:24px; border-left:3px solid var(--amber); background:#FFF8EA;
  padding:8px 11px; font-size:10px; color:var(--navy-d); line-height:1.5}
.cp-cav{margin-top:12px; border-top:1px solid var(--line); padding-top:8px;
  font-size:9px; color:var(--red-t); line-height:1.5}
body.mono .cp-rule{background:#000 !important}
body.mono .cp-nota{background:var(--white) !important; border-left-color:#000 !important}
body.mono .cp-cav{color:#000 !important}
body.mono .cp-meta .k,body.mono .cp-sum b{color:#000 !important}

/* =========================================================================
   rev.15 — IMPRESSAO EM PDF DA CAPTURA DA PAGINA INTEIRA
   Folha unica sob medida, com a altura real do documento. O enquadramento e
   o MESMO do PNG, por construcao: ambos partem de scrollWidth x scrollHeight.

   A classe .captura NEUTRALIZA todo o estilo de impressao A3 — nada de
   ocultar a navegacao, nada de escalar, nada de refluir a grade. O objetivo
   aqui e o oposto do dossie: reproduzir a tela, nao diagrama-la para papel.
   A largura da pagina passa a ser a largura de layout, de modo que nenhum
   elemento reflui.

   A diretiva @page com dimensao sob medida e injetada em tempo de execucao
   (ver capturarPDF): a altura so se conhece com a pagina montada.
   ========================================================================= */
@media print{
  body.captura header,body.captura nav,body.captura footer,body.captura .bar,
  body.captura .langs,body.captura .clock{display:block !important}
  body.captura .langs,body.captura .clock,body.captura .bar{display:flex !important}
  body.captura .view{display:none !important}
  body.captura .view.on{display:block !important; width:auto !important;
    transform:none !important; zoom:1 !important}
  body.captura main{padding:18px 22px !important; max-width:none !important}
  body.captura .prfoot{display:none !important}
  body.captura .capa{display:none !important}
  body.captura #btnPNG,body.captura #btnPDF{display:none !important}
  body.captura .grid{grid-template-columns:repeat(auto-fit,minmax(275px,1fr)) !important}
  body.captura .card,body.captura .kpi,body.captura .tw,body.captura table,
  body.captura .chart,body.captura .notice{break-inside:auto; page-break-inside:auto}
}

/* --- medição: mesmo layout da impressão, fora do contexto @media print --- */
body.prmeasure{position:relative}
body.prmeasure nav,body.prmeasure .langs,body.prmeasure .btn,body.prmeasure .bar,
body.prmeasure .mask,body.prmeasure .clock,body.prmeasure footer,
body.prmeasure header,body.prmeasure .src-h .tog{display:none !important}
body.prmeasure main{padding:0; max-width:none}
body.prmeasure .view{display:none !important}
body.prmeasure .view.prtgt{display:block !important; width:1527px; transform:none}
body.prmeasure .view.cols5 .grid{grid-template-columns:repeat(5,1fr) !important}
body.prmeasure .grid{grid-template-columns:repeat(3,1fr)}
body.prmeasure .chart svg{min-width:0}
body.prmeasure .src.fold .src-b{display:block}
body.prmeasure tr.prhide{display:none !important}
body.prmeasure .prfoot{display:block !important; font-size:8.5px; line-height:1.45}

/* =========================================================================
   MODO MONOCROMÁTICO
   O nível é diferenciado por FORMA e ESPESSURA DE TRAÇO, não só por cor.
   Converter tudo em preto suprimindo a cor tornaria um evento verde
   indistinguível de um evento crítico — degradaria exatamente a informação
   de segurança que o painel existe para transmitir.
   ========================================================================= */
@media print{
  body.mono .chip{background:var(--white) !important; color:#000 !important; border-color:#000 !important}
  body.mono .ch-critico{background:#000 !important; color:var(--white) !important}
  body.mono .kpi,body.mono .met,body.mono .c-hd,body.mono th,body.mono .notice,
  body.mono tbody tr:nth-child(even){background:var(--white) !important}
  body.mono th{border-bottom:1.5px solid #000; color:#000}
  body.mono .notice{border-color:#000 !important; border-left-color:#000 !important}
  body.mono .notice h4,body.mono .kpi .vl,body.mono .c-cd,body.mono .secttl{color:#000 !important}
  body.mono .card{border-color:#000 !important}
  body.mono .act{border-left-color:#000 !important}
  /* badge de UV: o fio lateral vira preto; a distincao permanece pelo glifo
     de preenchimento progressivo e pelo rotulo textual da faixa */
  body.mono .uvb{border-color:#000 !important; border-left-color:#000 !important;
    color:#000 !important; background:var(--white) !important}
  body.mono .uvnota,body.mono .uvnota b{color:#000 !important}
  body.mono .mark,body.mono .brand,body.mono .cp-top .mark{color:#000 !important}
  /* bandeira colapsa para código ISO: cinco bandeiras em cinza seriam
     indistinguíveis; o código permanece legível */
  body.mono .flag{display:none !important}
  /* rev.09 — faixa de paises em monocromatico: a cor da bolinha colapsa, mas a
     FORMA sustenta integralmente a distincao de nivel — vazada, anel grosso,
     solida, solida com anel externo, tracejada. Somam-se o glifo e o ISO.
     Cinco bolinhas em cinza indistinguiveis seriam falha grave: um pais verde
     nao pode confundir-se com um pais critico em fotocopia. */
  body.mono .flagbar .fg-w{background:var(--white) !important; border-color:#000 !important}
  body.mono .flagbar .fg-l{color:#000 !important}
  body.mono .flagbar .fb-t{color:#000 !important}
  body.mono .flagbar .fg-d{border-color:#000 !important; box-shadow:none !important}
  body.mono .fg-verde .fg-d{background:var(--white) !important; border-width:2px !important}
  body.mono .fg-ambar .fg-d{background:var(--white) !important; border-width:4px !important}
  body.mono .fg-vermelho .fg-d{background:#000 !important; border-width:2px !important}
  body.mono .fg-critico .fg-d{background:#000 !important; border-width:2px !important;
    box-shadow:0 0 0 2px var(--white), 0 0 0 4px #000 !important; margin-bottom:3px}
  body.mono .fg-indef .fg-d{background:var(--white) !important; border-width:2px !important;
    border-style:dashed !important}
  /* rev.20 — a bolinha do cartao segue exatamente a mesma degradacao
     monocromatica da bolinha do pais: colapsa a cor, a FORMA sustenta a
     distincao. Sem esta clausula, dez bolinhas cinza identicas na folha A3
     em preto e branco anulariam o proprio proposito do indicador. */
  body.mono .c-dot{border-color:#000 !important; box-shadow:none !important}
  body.mono .cd-verde .c-dot{background:var(--white) !important; border-width:2px !important}
  body.mono .cd-ambar .c-dot{background:var(--white) !important; border-width:4px !important}
  body.mono .cd-vermelho .c-dot{background:#000 !important; border-width:2px !important}
  body.mono .cd-critico .c-dot{background:#000 !important; border-width:2px !important;
    box-shadow:0 0 0 2px var(--white), 0 0 0 4px #000 !important; margin-right:3px}
  body.mono .cd-indef .c-dot{background:var(--white) !important; border-width:2px !important;
    border-style:dashed !important}
  /* rev.20 — criticidade do ativo em monocromatico: a cor colapsa, mas a
     ESPESSURA do fio lateral distingue as duas faixas, e o rotulo textual
     permanece integralmente legivel. */
  body.mono .crt{color:#000 !important; border-color:#000 !important;
    background:var(--white) !important}
  body.mono .crt-alta{border-left-width:3px !important}
  body.mono .crt-critica{border-left-width:6px !important}
  body.mono .iso{border-color:#000 !important; color:#000 !important; font-size:9.5px}
  body.mono .isoP{display:inline-block !important; color:#000 !important;
    border:1px solid #000; border-radius:3px; padding:0 4px; line-height:13px}
  body.mono .src-i a{color:#000 !important; border-bottom-color:#000 !important}
  body.mono .src-cav,body.mono .coord em{color:#000 !important}
  body.mono .tarja{border-color:#000 !important; color:#000 !important; background:var(--white) !important}
  /* gráficos: traço e marcador em preto; as FORMAS continuam a distinguir o
     nível, e as faixas de fundo coloridas são suprimidas */
  body.mono svg .clr{stroke:#000 !important}
  body.mono svg .clrf{fill:#000 !important; stroke:#000 !important}
  body.mono svg .band{display:none !important}
  body.mono svg .bandln{stroke:#000 !important; opacity:.55 !important}
  body.mono svg text{fill:#000 !important}
}

/* =========================================================================
   rev.21 — FAIXA DE DADO EMBUTIDO E AVISO EM TELA
   A faixa ambar so aparece quando o painel opera com o dado gravado no
   proprio arquivo. O aviso em tela substitui alert(), que nao se exibe em
   quadro isolado — a mensagem, ali, se perderia em silencio.
   ========================================================================= */
.avEmb{background:#FDF3E3; border:1px solid var(--amber); border-left:4px solid var(--amber);
  color:var(--amb-t); padding:9px 24px; font-size:12.5px; line-height:1.5}
.avEmb b{color:var(--amb-t)}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:18px; max-width:620px;
  background:var(--navy-d); color:#fff; padding:11px 16px; border-radius:4px;
  font-size:12.5px; line-height:1.5; z-index:9999; box-shadow:0 6px 22px rgba(0,0,0,.28)}
@media print{ #toast{display:none} }
</style>
</head>
<body>

<header>
  <div class="hd-top">
    <div class="brandbox">
      <span class="mark">
        <svg viewBox="0 0 34 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NextStream">
          <g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="butt">
            <path d="M-4 -4.3H12L22 2H38"/><path d="M-4 2H12L22 8.3H38"/>
            <path d="M-4 8.3H12L22 14.6H38"/><path d="M-4 14.6H12L22 20.9H38"/>
            <path d="M-4 20.9H12L22 27.2H38"/>
          </g>
        </svg>
      </span>
      <span class="brand">NextStream</span>
    </div>
    <div class="hd-div"></div>
    <div>
      <div class="hd-title" data-i="hdTitle"></div>
      <div class="hd-sub" data-i="hdSub"></div>
    </div>
    <div class="spacer"></div>
    <div class="langs">
      <button data-lang="pt" class="on">PT</button>
      <button data-lang="es">ES</button>
      <button data-lang="en">EN</button>
    </div>
    <button class="btn pri" id="btnRefresh" data-i="btnRefresh"></button>
    <!-- rev.15 — o cabecalho fica com os DOIS botoes de captura, que cobrem
         rigorosamente a mesma area: a pagina inteira, rolada, como esta na
         tela. Impressao por painel e dossie desceram para a barra interna de
         cada painel, onde ja conviviam os botoes de cor e mono. Nada se
         perdeu; apenas deixou de disputar o cabecalho. -->
    <button class="btn pri" id="btnPNG" data-i="btnPNG"></button>
    <button class="btn" id="btnPDF" data-i="btnPDF"></button>
    <div class="clock">
      <div id="clock" class="nm"></div>
      <div id="fetchSt"></div>
      <!-- rev.10 — evidencia do ciclo automatico: ultima coleta concluida e
           contagem regressiva da proxima. Oculto na impressao junto com .clock;
           a evidencia impressa vai no rodape .prfoot. -->
      <div id="cicloSt" class="nm"></div>
    </div>
  </div>

  <!-- rev.09 — faixa de paises alinhada ao canto superior direito.
       Indicador circular de nivel acima de cada bandeira.
       Ordem alfabetica rev.11: AR, BR, CL, MX, PE. -->
  <div class="flagbar" id="flagbar"></div>
</header>

<!-- rev.21 — faixa de dado embutido: visivel apenas quando a coleta ao vivo
     nao se completa e o painel passa a exibir o dado gravado no arquivo. -->
<div class="avEmb" id="avEmb" hidden></div>
<div id="toast" hidden></div>

<nav>
  <button data-v="painel" class="on"><span class="gl">▦</span><span data-i="tabPainel"></span></button>
  <button data-v="sismos"><span class="gl">◬</span><span data-i="tabSismos"></span></button>
  <button data-v="meteo"><span class="gl">≋</span><span data-i="tabMeteo"></span></button>
  <button data-v="limiares"><span class="gl">▤</span><span data-i="tabLimiares"></span></button>
  <button data-v="registro"><span class="gl">✎</span><span data-i="tabRegistro"></span></button>
  <button data-v="fontes"><span class="gl">⚖</span><span data-i="tabFontes"></span></button>
</nav>

<main>
  <!-- rev.11 — capa de controle do dossie; visivel apenas na impressao -->
  <div class="capa" id="capa"></div>

  <!-- =================== PAINEL =================== -->
  <section class="view on" data-v="painel">
    <div class="notice rd">
      <h4 data-i="govT"></h4>
      <ul id="govList"></ul>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="secttl" data-i="sVento"></div>
    <div class="lgd" id="lgdVento"></div>
    <div class="secttl" data-i="sUV"></div>
    <div class="lgd" id="lgdUV"></div>
    <div class="uvnota" id="uvNota"></div>
    <div class="grid" id="cards"></div>
    <div class="prfoot" data-pf="painel"></div>
  </section>

  <!-- =================== SISMOS =================== -->
  <section class="view" data-v="sismos">
    <div class="bar noprint">
      <span class="spacer"></span>
      <span class="st"><span class="dot" id="dotUsgs"></span><span id="txtUsgs"></span></span>
    </div>
    <div class="notice bl">
      <h4 data-i="sisT"></h4>
      <p data-i="sisP"></p>
    </div>
    <div class="bar noprint">

<script>
/* =========================================================================
   NSPPTX — escritor de PPTX em JavaScript puro, sem biblioteca externa.

   Por que existe: o cockpit precisa permanecer autocontido. Uma biblioteca
   via CDN seria bloqueada pelo firewall corporativo; embutida em linha,
   levaria o arquivo de 119 KB a cerca de 1,3 MB.

   Como funciona: um PPTX e um pacote OPC, isto e, um ZIP de XML. Foi
   verificado que o PowerPoint aceita o pacote SEM COMPRESSAO (metodo STORED),
   o que dispensa qualquer implementacao de DEFLATE. Restam apenas o CRC-32 e
   os cabecalhos do ZIP.

   Slide dimensionado em A3 paisagem: 15.120.000 x 10.692.000 EMU. O slide E a
   pagina — nenhum dialogo de navegador pode sobrepor-se a essa dimensao.
   ========================================================================= */
(function (raiz) {
  "use strict";

  // ----------------------------------------------------------- unidades
  var EMU_MM = 914400 / 25.4;          // 36000 EMU por milimetro
  var EMU_PX = 914400 / 96;            // 9525 EMU por pixel a 96 dpi
  var A3 = { cx: Math.round(420 * EMU_MM), cy: Math.round(297 * EMU_MM) };

  // ----------------------------------------------------------- utilitarios
  function xml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&apos;")
      // caracteres de controle sao invalidos em XML 1.0
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
  }
  var CAB = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n';
  var NS_A = 'http://schemas.openxmlformats.org/drawingml/2006/main';
  var NS_P = 'http://schemas.openxmlformats.org/presentationml/2006/main';
  var NS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  var NS_REL = 'http://schemas.openxmlformats.org/package/2006/relationships';

  function utf8(str) {
    if (typeof TextEncoder !== "undefined") return new TextEncoder().encode(str);
    var b = [], i, c;
    for (i = 0; i < str.length; i++) {
      c = str.charCodeAt(i);
      if (c < 128) b.push(c);
      else if (c < 2048) b.push(192 | c >> 6, 128 | c & 63);
      else b.push(224 | c >> 12, 128 | c >> 6 & 63, 128 | c & 63);
    }
    return new Uint8Array(b);
  }

  // ----------------------------------------------------------- CRC-32
  var TAB = (function () {
    var t = new Uint32Array(256), c, n, k;
    for (n = 0; n < 256; n++) {
      c = n;
      for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8) {
    var c = 0xFFFFFFFF, i;
    for (i = 0; i < u8.length; i++) c = TAB[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  // ----------------------------------------------------------- ZIP (STORED)
  function zip(itens) {
    var partes = [], central = [], off = 0;
    function u16(v) { return [v & 255, (v >> 8) & 255]; }
    function u32(v) { return [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255]; }
    itens.forEach(function (it) {
      var nome = utf8(it.nome), dados = it.dados, crc = crc32(dados);
      var lh = [].concat([0x50, 0x4B, 0x03, 0x04], u16(20), u16(0x0800), u16(0),
        u16(0), u16(0), u32(crc), u32(dados.length), u32(dados.length),
        u16(nome.length), u16(0));
      partes.push(new Uint8Array(lh), nome, dados);
      central.push([].concat([0x50, 0x4B, 0x01, 0x02], u16(20), u16(20), u16(0x0800),
        u16(0), u16(0), u16(0), u32(crc), u32(dados.length), u32(dados.length),
        u16(nome.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(off), nome));
      off += lh.length + nome.length + dados.length;
    });
    var cd = [], cdLen = 0;
    central.forEach(function (c) {
      var nome = c[c.length - 1], cab = new Uint8Array(c.slice(0, c.length - 1));
      cd.push(cab, nome); cdLen += cab.length + nome.length;
    });
    var fim = new Uint8Array([].concat([0x50, 0x4B, 0x05, 0x06], u16(0), u16(0),
      u16(itens.length), u16(itens.length), u32(cdLen), u32(off), u16(0)));
    var todos = partes.concat(cd, [fim]);
    var total = todos.reduce(function (a, b) { return a + b.length; }, 0);
    var saida = new Uint8Array(total), pos = 0;
    todos.forEach(function (b) { saida.set(b, pos); pos += b.length; });
    return saida;
  }

  // ----------------------------------------------------------- partes fixas
  function tema() {
    function estiloFundo() {
      return '<a:bgFillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill>'
        + '<a:solidFill><a:schemeClr val="phClr"><a:tint val="95000"/></a:schemeClr></a:solidFill>'
        + '<a:solidFill><a:schemeClr val="phClr"><a:shade val="90000"/></a:schemeClr></a:solidFill>'
        + '</a:bgFillStyleLst>';
    }
    return CAB + '<a:theme xmlns:a="' + NS_A + '" name="NextStream">'
      + '<a:themeElements>'
      + '<a:clrScheme name="NextStream"><a:dk1><a:srgbClr val="13233F"/></a:dk1>'
      + '<a:lt1><a:srgbClr val="FFFFFF"/></a:lt1><a:dk2><a:srgbClr val="1F3864"/></a:dk2>'
      + '<a:lt2><a:srgbClr val="EAF0FA"/></a:lt2><a:accent1><a:srgbClr val="1F3864"/></a:accent1>'
      + '<a:accent2><a:srgbClr val="B9CCEA"/></a:accent2><a:accent3><a:srgbClr val="E8A33D"/></a:accent3>'
      + '<a:accent4><a:srgbClr val="C0392B"/></a:accent4><a:accent5><a:srgbClr val="4F7942"/></a:accent5>'
      + '<a:accent6><a:srgbClr val="6B7280"/></a:accent6><a:hlink><a:srgbClr val="1F3864"/></a:hlink>'
      + '<a:folHlink><a:srgbClr val="6B7280"/></a:folHlink></a:clrScheme>'
      + '<a:fontScheme name="Arial"><a:majorFont><a:latin typeface="Arial"/><a:ea typeface=""/>'
      + '<a:cs typeface=""/></a:majorFont><a:minorFont><a:latin typeface="Arial"/><a:ea typeface=""/>'
      + '<a:cs typeface=""/></a:minorFont></a:fontScheme>'
      + '<a:fmtScheme name="NextStream">'
      + '<a:fillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill>'
      + '<a:solidFill><a:schemeClr val="phClr"><a:tint val="60000"/></a:schemeClr></a:solidFill>'
      + '<a:solidFill><a:schemeClr val="phClr"><a:shade val="80000"/></a:schemeClr></a:solidFill>'
      + '</a:fillStyleLst>'
      + '<a:lnStyleLst>'
      + '<a:ln w="9525" cap="flat"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:prstDash val="solid"/></a:ln>'
      + '<a:ln w="15875" cap="flat"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:prstDash val="solid"/></a:ln>'
      + '<a:ln w="25400" cap="flat"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:prstDash val="solid"/></a:ln>'
      + '</a:lnStyleLst>'
      + '<a:effectStyleLst><a:effectStyle><a:effectLst/></a:effectStyle>'
      + '<a:effectStyle><a:effectLst/></a:effectStyle>'
      + '<a:effectStyle><a:effectLst/></a:effectStyle></a:effectStyleLst>'
      + estiloFundo()
      + '</a:fmtScheme></a:themeElements></a:theme>';
  }

  function mestre() {
    return CAB + '<p:sldMaster xmlns:a="' + NS_A + '" xmlns:r="' + NS_R + '" xmlns:p="' + NS_P + '">'
      + '<p:cSld><p:bg><p:bgPr><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill>'
      + '<a:effectLst/></p:bgPr></p:bg>'
      + '<p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>'
      + '<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/>'
      + '<a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr></p:spTree></p:cSld>'
      + '<p:clrMap bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2"'
      + ' accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6"'
      + ' hlink="hlink" folHlink="folHlink"/>'
      + '<p:sldLayoutIdLst><p:sldLayoutId id="2147483649" r:id="rId1"/></p:sldLayoutIdLst>'
      + '</p:sldMaster>';
  }

  function layout() {
    return CAB + '<p:sldLayout xmlns:a="' + NS_A + '" xmlns:r="' + NS_R + '" xmlns:p="' + NS_P + '"'
      + ' type="blank" preserve="1">'
      + '<p:cSld name="Em branco"><p:spTree>'
      + '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>'
      + '<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/>'
      + '<a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr></p:spTree></p:cSld>'
      + '<p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sldLayout>';
  }

  function rels(lista) {
    return CAB + '<Relationships xmlns="' + NS_REL + '">'
      + lista.map(function (r) {
        return '<Relationship Id="' + r.id + '" Type="' + r.tipo + '" Target="' + r.alvo + '"/>';
      }).join("") + '</Relationships>';
  }

  // ----------------------------------------------------------- corpo de texto
  function corridas(runs, algn) {
    return '<a:p><a:pPr algn="' + (algn || "l") + '"/>'
      + runs.map(function (r) {
        return '<a:r><a:rPr lang="pt-BR" sz="' + Math.round((r.sz || 10) * 100) + '"'
          + (r.b ? ' b="1"' : '') + (r.i ? ' i="1"' : '') + ' dirty="0">'
          + '<a:solidFill><a:srgbClr val="' + (r.cor || "1A1A1A") + '"/></a:solidFill>'
          + '<a:latin typeface="Arial"/></a:rPr><a:t>' + xml(r.t) + '</a:t></a:r>';
      }).join("") + '</a:p>';
  }

  // ----------------------------------------------------------- objetos de slide
  function Slide() { this.formas = []; this.imgs = []; this._id = 10; }

  Slide.prototype.texto = function (runs, o) {
    o = o || {};
    var id = ++this._id;
    this.formas.push('<p:sp><p:nvSpPr><p:cNvPr id="' + id + '" name="T' + id + '"/>'
      + '<p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr>'
      + '<p:spPr><a:xfrm><a:off x="' + Math.round(o.x) + '" y="' + Math.round(o.y) + '"/>'
      + '<a:ext cx="' + Math.round(o.cx) + '" cy="' + Math.round(o.cy) + '"/></a:xfrm>'
      + '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr>'
      + '<p:txBody><a:bodyPr wrap="square" lIns="0" tIns="0" rIns="0" bIns="0" anchor="t"/>'
      + '<a:lstStyle/>' + corridas(runs, o.algn) + '</p:txBody></p:sp>');
    return this;
  };

  Slide.prototype.retangulo = function (o) {
    var id = ++this._id;
    this.formas.push('<p:sp><p:nvSpPr><p:cNvPr id="' + id + '" name="R' + id + '"/>'
      + '<p:cNvSpPr/><p:nvPr/></p:nvSpPr>'
      + '<p:spPr><a:xfrm><a:off x="' + Math.round(o.x) + '" y="' + Math.round(o.y) + '"/>'
      + '<a:ext cx="' + Math.round(o.cx) + '" cy="' + Math.round(o.cy) + '"/></a:xfrm>'
      + '<a:prstGeom prst="' + (o.arred ? "roundRect" : "rect") + '"><a:avLst/></a:prstGeom>'
      + (o.fundo ? '<a:solidFill><a:srgbClr val="' + o.fundo + '"/></a:solidFill>' : '<a:noFill/>')
      + (o.fio ? '<a:ln w="' + Math.round((o.fioW || 1) * 12700) + '"><a:solidFill>'
        + '<a:srgbClr val="' + o.fio + '"/></a:solidFill></a:ln>' : '<a:ln><a:noFill/></a:ln>')
      + '</p:spPr><p:txBody><a:bodyPr/><a:lstStyle/><a:p/></p:txBody></p:sp>');
    return this;
  };

  /* Tabela NATIVA do PowerPoint: editavel, pesquisavel e copiavel pelo
     destinatario. Superior a imagem para efeito de dossie de evidencia. */
  Slide.prototype.tabela = function (linhas, o) {
    var id = ++this._id, larg = o.larguras;
    var total = larg.reduce(function (a, b) { return a + b; }, 0);
    var s = '<p:graphicFrame><p:nvGraphicFramePr>'
      + '<p:cNvPr id="' + id + '" name="Tab' + id + '"/>'
      + '<p:cNvGraphicFramePr><a:graphicFrameLocks noGrp="1"/></p:cNvGraphicFramePr>'
      + '<p:nvPr/></p:nvGraphicFramePr>'
      + '<p:xfrm><a:off x="' + Math.round(o.x) + '" y="' + Math.round(o.y) + '"/>'
      + '<a:ext cx="' + Math.round(total) + '" cy="' + Math.round(o.cy) + '"/></p:xfrm>'
      + '<a:graphic><a:graphicData uri="' + NS_A.replace("/main", "/table") + '">'
      + '<a:tbl><a:tblPr firstRow="1"/><a:tblGrid>'
      + larg.map(function (w) { return '<a:gridCol w="' + Math.round(w) + '"/>'; }).join("")
      + '</a:tblGrid>';
    linhas.forEach(function (lin, li) {
      s += '<a:tr h="' + Math.round(o.alturaLinha || (0.16 * 914400)) + '">';
      lin.forEach(function (cel) {
        var c = (typeof cel === "object" && cel !== null) ? cel : { t: cel };
        var fundo = c.fundo || (li === 0 ? o.fundoCab : (li % 2 === 0 ? o.fundoPar : null));
        s += '<a:tc><a:txBody><a:bodyPr/><a:lstStyle/>'
          + corridas([{ t: c.t, sz: c.sz || o.sz || 8, b: c.b || (li === 0),
                        cor: c.cor || (li === 0 ? (o.corCab || "13233F") : "1A1A1A") }], c.algn || "l")
          + '</a:txBody><a:tcPr marL="36576" marR="36576" marT="18288" marB="18288" anchor="ctr">'
          + (fundo ? '<a:solidFill><a:srgbClr val="' + fundo + '"/></a:solidFill>' : '<a:noFill/>')
          + '<a:lnB w="6350"><a:solidFill><a:srgbClr val="' + (o.fio || "DDE3EE") + '"/></a:solidFill></a:lnB>'
          + '</a:tcPr></a:tc>';
      });
      s += '</a:tr>';
    });
    this.formas.push(s + '</a:tbl></a:graphicData></a:graphic></p:graphicFrame>');
    return this;
  };

  /* Imagem PNG a partir de base64. Usada para os graficos: o MESMO SVG da tela
     rasterizado, e nao uma reimplementacao — identico por construcao. */
  Slide.prototype.imagem = function (b64, o) {
    var id = ++this._id;
    var n = this.imgs.length + 1;
    var rid = "rIdImg" + n;
    this.imgs.push({ rid: rid, b64: b64, nome: "img" + n + ".png" });

/* rev.21 — VALIDADE DO BLOCO EMBUTIDO.
   Dado velho exibido em sala de crise e pior do que ausencia de dado: induz
   decisao sobre um estado do mundo que ja passou. Vencido o prazo abaixo, o
   bloco deixa de ser exibido e o painel declara a indisponibilidade. O prazo
   deve ser folgado em relacao ao periodo de regravacao do arquivo: com
   regravacao de 30 min, 48 h absorvem uma parada de fim de semana sem exibir
   dado de outra semana. */
const EMB_VALIDADE = 48*3600*1000;
function embutidoValido(){
  if(!EMBUTIDO || !EMBUTIDO.sites) return false;
  const g = Date.parse(EMBUTIDO.gerado);
  if(isNaN(g)) return false;
  return (Date.now() - g) <= EMB_VALIDADE;
}

function haversine(la1,lo1,la2,lo2){
  const R=6371, r=Math.PI/180;
  const dLa=(la2-la1)*r, dLo=(lo2-lo1)*r;
  const a=Math.sin(dLa/2)**2 + Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

/* rev.07 — ACUMULADO DE PRECIPITACAO DAS ULTIMAS 24 HORAS
   Soma as 24 leituras horarias encerradas na hora corrente do site. Grandeza
   distinta da taxa instantanea (mm/h) exposta na aba Meteorologia: e o
   acumulado que dialoga com alagamento de patio, acesso de veiculo pesado e
   escoamento de cobertura. Se a serie estiver incompleta, soma o que existe e
   devolve o numero de horas efetivamente somadas, para que a leitura jamais
   se apresente como completa quando nao o for. */
function acum24(serie, horaAtual){
  if(!Array.isArray(serie) || !serie.length) return null;
  let fim = -1;
  if(horaAtual){
    const alvo = String(horaAtual).slice(0,13);
    fim = serie.findIndex(h => String(h.t).slice(0,13) === alvo);
  }
  if(fim < 0){
    const agora = Date.now();
    for(let i=0; i<serie.length; i++){
      const ts = Date.parse(serie[i].t);
      if(!isNaN(ts) && ts <= agora) fim = i; else break;
    }
  }
  if(fim < 0) return null;
  const ini = Math.max(0, fim-23);
  let soma = 0, n = 0;
  for(let i=ini; i<=fim; i++){
    const p = serie[i]?.pr;
    if(p!=null && !isNaN(p)){ soma += Number(p); n++; }
  }
  if(!n) return null;
  return {mm: Math.round(soma*10)/10, horas: n, parcial: n < 24};
}

  const k = critKey(v);
  return `<span class="crt crt-${k}" title="${esc(T().critT)}">`
       + `<span class="g">${GLIFO_CRIT[k]}</span>${esc(T().critL[k])}</span>`;
};

/* Marcador de nivel nos graficos, diferenciado por FORMA e ESPESSURA.
   Razao: em impressao monocromatica, converter tudo em preto suprimindo apenas
   a cor tornaria indistinguiveis um evento verde e um evento critico. A forma
   sobrevive a ausencia de cor. */
const ESPNV = {verde:1.4, ambar:2.0, vermelho:2.8, critico:3.2, indef:1.2};
function marcaNv(x, y, nv, r){
  const c = CORNV[nv] || CORNV.indef;
  if(nv === "ambar")
    return `<polygon class="clrf" points="${x},${y-r*1.2} ${x+r*1.05},${y+r*0.78} ${x-r*1.05},${y+r*0.78}" fill="${c}"/>`;
  if(nv === "vermelho")
    return `<rect class="clrf" x="${x-r*0.92}" y="${y-r*0.92}" width="${r*1.84}" height="${r*1.84}" fill="${c}"/>`;
  if(nv === "critico")
    return `<g class="clr" stroke="${c}" stroke-width="2" stroke-linecap="round">`
      + `<line x1="${x-r}" y1="${y-r}" x2="${x+r}" y2="${y+r}"/>`
      + `<line x1="${x-r}" y1="${y+r}" x2="${x+r}" y2="${y-r}"/></g>`;
  return `<circle class="clr" cx="${x}" cy="${y}" r="${r*0.92}" fill="none" stroke="${c}" stroke-width="1.7"/>`;
}
const S = c => SITES.find(x=>x.cod===c);
const isoDe = c => { const x = S(c); return x ? x.iso : ""; };
/* Celula de bandeira: desenho na tela, codigo ISO no monocromatico impresso. */
const celBand = c => {
  const iso = isoDe(c);
  if(!iso) return '<td class="bnd">—</td>';
  return '<td class="bnd">' + (FLAG[iso] ? '<span class="flag">'+FLAG[iso]+'</span>' : '')
    + '<span class="isoP">' + esc(iso) + '</span></td>';
};

/* ---------------------------------------------- 6. COLETA */
/* rev.10 — requisicao com tempo limite. Sem isto, uma conexao pendurada retem o
   ciclo indefinidamente e o painel permanece em "Coletando" sem desfecho. */
async function fetchTO(u){
  const ac = new AbortController();
  const t = setTimeout(()=>ac.abort(), TOFETCH);
  try{ return await fetch(u, {signal:ac.signal}); }
  finally{ clearTimeout(t); }
}
/* rev.10 — uma unica repeticao. Falha transitoria de rede deixa de imobilizar o
   dado do site pelos 30 minutos ate o ciclo seguinte. Repeticao unica por
   deliberacao: mais tentativas elevariam o volume contra licenca nao comercial. */
async function fetchRep(u){
  try{
    const r = await fetchTO(u);
    if(!r.ok) throw new Error(r.status);
    return r;
  }catch(e){
    await new Promise(res=>setTimeout(res, REPESPERA));
    const r2 = await fetchTO(u);
    if(!r2.ok) throw new Error(r2.status);
    return r2;
  }
}

/* rev.21 — CONVERSAO DO BLOCO EMBUTIDO PARA A ESTRUTURA DE TRABALHO.
   O acumulado de 24 h e o nivel sismico NAO vem gravados: sao recalculados
   aqui pelas mesmas funcoes que servem ao dado ao vivo, de modo que regra de
   classificacao exista em um unico lugar. */
function aplicarEmbutido(){
  if(!EMBUTIDO || !EMBUTIDO.sites) return false;
  const corte = Date.now() - JANELA*24*3600*1000;
  DADOS = {}; SISMOS = [];
  SITES.forEach(s=>{
    const e = EMBUTIDO.sites[s.cod];
    const d = {atual:null, hora:[], sismos:[], erroV:!e, erroS:false};
    if(e){
      d.atual = e.a || null;
      const ts = e.t || [];
      d.hora = ts.map((t,i)=>({t:t, raj:e.raj?.[i], pr:e.pr?.[i], ap:e.ap?.[i], uv:e.uv?.[i]}));
      d.chuva24 = acum24(d.hora, d.atual?.hora);
    }
    DADOS[s.cod] = d;
  });
  (EMBUTIDO.sismos||[]).forEach(ev=>{
    if(ev.quando && ev.quando < corte) return;
    const s = S(ev.site); if(!s) return;
    const reg = Object.assign({}, ev, {
      nivel: (ev.dist!=null && ev.dist<=s.raio) ? nivelSismo(ev.mag) : "verde",
      origem: "embutido"});
    SISMOS.push(reg);
    if(DADOS[ev.site]) DADOS[ev.site].sismos.push(reg);
  });
  return true;
}

async function coletarNucleo(){
  setFetch("wk", T().stLd);
  DADOS = {}; SISMOS = [];
  let ok=0, er=0;
  const t0 = new Date(Date.now()-JANELA*24*3600*1000).toISOString().slice(0,19);

  await Promise.all(SITES.map(async s=>{
    const d = {atual:null, hora:[], sismos:[], erroV:false, erroS:false};

    try{
      const u = "https://api.open-meteo.com/v1/forecast?latitude="+s.lat+"&longitude="+s.lon
        + "&current=wind_speed_10m,wind_gusts_10m,temperature_2m,apparent_temperature,precipitation,relative_humidity_2m,uv_index"
        + "&hourly=wind_gusts_10m,precipitation,apparent_temperature,uv_index"
        + "&wind_speed_unit=kmh&forecast_days=7&past_days=1&timezone=auto";
      const r = await fetchRep(u);   /* rev.10 — tempo limite + uma repeticao */
      const j = await r.json();
      d.atual = {
        rajada:j.current?.wind_gusts_10m, vel:j.current?.wind_speed_10m,
        temp:j.current?.temperature_2m, aparente:j.current?.apparent_temperature,
        chuva:j.current?.precipitation, umid:j.current?.relative_humidity_2m,
        uv:j.current?.uv_index,
        hora:j.current?.time,
      };
      const H = j.hourly||{};
      d.hora = (H.time||[]).map((t,i)=>({
        t:t, raj:H.wind_gusts_10m?.[i], pr:H.precipitation?.[i], ap:H.apparent_temperature?.[i],
        uv:H.uv_index?.[i],
      }));
      d.chuva24 = acum24(d.hora, d.atual?.hora);
      ok++;
    }catch(e){ d.erroV = true; er++; }

    try{
      const u = "https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson"
        + "&latitude="+s.lat+"&longitude="+s.lon+"&maxradiuskm="+s.raio
        + "&minmagnitude=3.0&starttime="+t0+"&orderby=time";
      const r = await fetchRep(u);   /* rev.10 — tempo limite + uma repeticao */
      const j = await r.json();
      d.sismos = (j.features||[]).map(f=>{
        const c = f.geometry?.coordinates||[], mag = f.properties?.mag;
        const dist = haversine(s.lat, s.lon, c[1], c[0]);
        return {id:f.id, site:s.cod, pais:s.pais, mag, prof:c[2], dist,
                quando:f.properties?.time, local:f.properties?.place||"—",
                nivel:dist<=s.raio?nivelSismo(mag):"verde", origem:"vivo"};
      });
      SISMOS = SISMOS.concat(d.sismos);
      ok++;
    }catch(e){ d.erroS = true; er++; }

    DADOS[s.cod] = d;
  }));

  /* rev.21 — RECURSO DE PUBLICACAO. Nenhuma consulta ao vivo concluida:
     o painel passa ao dado embutido, em vez de exibir tela vazia sob o
     rotulo "Coleta indisponivel". Havendo ao menos uma consulta ao vivo
     bem-sucedida, o dado ao vivo prevalece e o bloco embutido e ignorado. */
  MODOEMB = false; EMBVENC = false;
  if(ok === 0 && EMBUTIDO && EMBUTIDO.sites){
    if(embutidoValido()) MODOEMB = aplicarEmbutido();
    else EMBVENC = true;
  }

  // ---- persistir e fundir com a memoria local (clausula 11.3.4)
  try{ await gravarSismos(SISMOS); }catch(e){ /* segue sem persistencia */ }
  MEMEXTRA = 0;
  try{
    const mem = await lerSismos(Date.now() - JANELA*24*3600*1000);
    const vistos = new Set(SISMOS.map(e=>(e.id||("x"+e.quando))+"|"+e.site));
    const extra = mem.filter(e=>!vistos.has(e.k)).map(e=>({...e, origem:"memoria"}));
    MEMEXTRA = extra.length;
    SISMOS = SISMOS.concat(extra);
  }catch(e){ MEMEXTRA = 0; }
  purgarSismos();

  SISMOS.sort((a,b)=>(b.quando||0)-(a.quando||0));
  if(MODOEMB){
    /* rev.21 — a hora exibida em "Ultima coleta" e a da GERACAO do bloco, e
       nao a do ciclo que falhou: dizer o contrario seria datar o dado pela
       tentativa, e nao pela leitura das fontes. */
    const g = new Date(EMBUTIDO.gerado);
    ULT = isNaN(g.getTime()) ? new Date() : g;
    STFETCH = T().stEmb;
    setFetch("wk", STFETCH);
  }else{
    ULT = new Date();
    const cls = er===0?"ok":(ok>0?"wk":"er");
    STFETCH = er===0?T().stOk:(ok>0?T().stWk:(EMBVENC?T().stEmbVenc:T().stEr));
    setFetch(cls, STFETCH);
  }
  render();
  renderEmb();
}

/* rev.10 — INVOLUCRO COM TRAVA DE CONCORRENCIA
   Na rev.09, acionar o botao Atualizar durante um ciclo automatico disparava uma
   segunda execucao que zerava DADOS e SISMOS enquanto a primeira ainda escrevia,
   podendo exibir estado parcial em sala de crise. A trava impede a sobreposicao:
   havendo coleta em curso, a solicitacao e recusada com aviso explicito, sem
   qualquer efeito sobre os dados ja consolidados. */
async function coletar(){
  if(COLETANDO){ setFetch("wk", T().stBusy); return false; }
  COLETANDO = true;
  cancelarTimer();
  renderCiclo();
  try{
    await coletarNucleo();
  }catch(e){
    setFetch("er", T().stEr);
    renderPrFoot();
  }finally{
    COLETANDO = false;
    agendar();
    renderCiclo();
  }
  return true;
}

/* rev.10 — AGENDAMENTO. Temporizador encadeado, e nao setInterval: o intervalo
   passa a ser contado a partir do TERMINO da coleta anterior, de modo que uma
   coleta demorada nao encavala a seguinte. */
function cancelarTimer(){ if(TIMER){ clearTimeout(TIMER); TIMER = null; } }
function agendar(){
  cancelarTimer();
  PROX = Date.now() + PERIODO;
  SUSP = false;
  if(document.hidden){ SUSP = true; return; }   // suspende; PROX preservado
  TIMER = setTimeout(()=>{ coletar(); }, PERIODO);
}

/* rev.10 — SUSPENSAO COM ABA OCULTA. Reduz chamadas desnecessarias contra a
   licenca nao comercial do Open-Meteo (vinte chamadas por ciclo: dez sites por
   dois provedores). Ao retornar o foco, se a coleta ja estava vencida, executa
   imediatamente; caso contrario, reprograma o tempo remanescente. */
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){
    cancelarTimer();
    if(!COLETANDO && PROX) SUSP = true;
    renderCiclo();
    return;
  }
  SUSP = false;
  if(COLETANDO || !PROX){ renderCiclo(); return; }
  const falta = PROX - Date.now();
  if(falta <= 0){ coletar(); }
  else { cancelarTimer(); TIMER = setTimeout(()=>{ coletar(); }, falta); renderCiclo(); }
});

/* rev.10 — EVIDENCIA DO CICLO. Sem carimbo visivel, o operador nao distingue
   "tudo verde" de "dado congelado ha horas". Exibe a ultima coleta concluida e
   a contagem regressiva da proxima, junto ao relogio do cabecalho. */
/* rev.19 — GRAFIA DE DATA E HORA DO CABECALHO, escopo deliberadamente restrito
   ao bloco do canto superior direito. Duas funcoes auxiliares locais, usadas
   somente por fmtRest(), renderCiclo() e tick(). Todo o restante do arquivo
   — rodape de impressao, capa do dossie, tabelas, eixos de grafico, celulas
   PPTX e exportacoes CSV — permanece na grafia anterior, por decisao expressa.
   Razao de existirem funcoes proprias em vez de opcoes de Intl: o separador de
   data e de hora e propriedade do locale e NAO e configuravel por opcao. Impor
   hifen e "hNNmin" exige montar a cadeia campo a campo.
   Efeito colateral desejado: a grafia deixa de variar entre PT, ES e EN — o
   en-US emitia mes antes do dia e sufixo AM/PM, ambiguidade inaceitavel em
   documento de distribuicao controlada. */
const hdZ = n => String(n).padStart(2,"0");
const hdData = d => d.getFullYear() + "-" + hdZ(d.getMonth()+1) + "-" + hdZ(d.getDate());
const hdHora = d => hdZ(d.getHours()) + "h" + hdZ(d.getMinutes()) + "min";

/* rev.19 — a contagem regressiva e DURACAO, nao hora do dia: grafia com
   sufixo de unidade, sem dois-pontos. */
function fmtRest(ms){
  if(ms < 0) ms = 0;
  const s = Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,"0") + "min" + String(s%60).padStart(2,"0") + "s";
}
function renderCiclo(){
  const el = document.getElementById("cicloSt");
  if(!el) return;
  const ult = ULT ? hdHora(ULT)          /* rev.19 — 08h57min */
                  : T().semCol;
  let prox;
  if(COLETANDO)      prox = T().colEmCurso;
  else if(SUSP)      prox = T().colSusp;
  else if(PROX)      prox = T().proxCol + " " + fmtRest(PROX - Date.now());
  else               prox = "—";
  el.textContent = T().ultCol + " " + ult + " · " + prox;
}

/* rev.21 — procedencia do evento sismico: ao vivo, memoria local ou bloco
   embutido. Um unico ponto de decisao, usado na tabela e na exportacao. */
function rotOrigem(o){
  return o==="memoria" ? T().memoria : (o==="embutido" ? T().embOrig : T().vivo);
}

function setFetch(cls,txt){
  STFETCH = txt;
  document.getElementById("fetchSt").innerHTML =
    `<span class="st"><span class="dot ${cls}"></span>${esc(txt)}</span>`;
  const du=document.getElementById("dotUsgs");

}

/* rev.21 — AVISO EM TELA. alert() nao se exibe em quadro isolado sem
   allow-modals: a mensagem desapareceria sem rastro. O aviso passa a ser um
   bloco da propria pagina, que some sozinho. */
function aviso(txt){
  const el = document.getElementById("toast");
  if(!el){ try{ alert(txt); }catch(e){} return; }
  el.textContent = txt;
  el.hidden = false;
  clearTimeout(aviso._t);
  aviso._t = setTimeout(()=>{ el.hidden = true; }, 14000);
}
/* Advertencia de exportacao: so faz sentido onde o salvamento pode estar
   bloqueado pelo ambiente de publicacao. */
function avisoDownload(){ if(HOSPEDADO) aviso(T().dlAviso); }

/* rev.21 — FAIXA DE DADO EMBUTIDO. Declara a condicao e a data da coleta. */
function renderEmb(){
  const el = document.getElementById("avEmb");
  if(!el) return;
  if(!MODOEMB){ el.hidden = true; return; }
  /* A linha de estado acompanha o idioma corrente: trocado o idioma, o
     rotulo do modo embutido nao pode permanecer no idioma anterior. */
  if(STFETCH !== T().stEmb) setFetch("wk", T().stEmb);
  const g = new Date(EMBUTIDO.gerado);
