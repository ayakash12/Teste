/* =========================================================================
   rev.21  11A · ALERTA IMEDIATO
   ------------------------------------------------------------------------
   PROBLEMA QUE RESOLVE. Até a rev.20 o cockpit era passivo: um sítio podia
   entrar em vermelho às 03h14 e permanecer assim até alguém abrir a aba
   Painel e reparar no cartão. Em sala de crise isso é aceitável; na rotina
   de plantão, não é.

   O QUE ESTE MÓDULO NÃO FAZ — leitura obrigatória antes de qualquer edição:
   • NÃO cria limiar. Reaproveita nivelSitePainel() e ORD. AL_MIN é um
     PONTO DE CORTE DE INTERRUPÇÃO sobre a escala já homologanda, não uma
     faixa nova. As seções 2.1, 2.2 e 8 da especificação seguem intactas.
   • NÃO constitui acionamento formal. A faixa reproduz a ressalva em todos
     os idiomas e remete à cláusula 5.3.
   • NÃO envia nada para fora do navegador. Sem servidor, sem webhook, sem
     e-mail — o item D1 do backlog permanece em aberto e é decisão de
     arquitetura da Diretoria, não de implementação.
   • NÃO altera a suspensão do ciclo com a aba oculta (rev.10). Decisão
     expressa: manter a economia de chamadas contra a licença não comercial
     da Open-Meteo enquanto a pendência A2 estiver no Jurídico.
     CONSEQUÊNCIA A COMUNICAR AO SOC: com a janela minimizada não há coleta,
     logo não há alerta novo. O cockpit precisa ficar visível no telão.

   QUATRO CANAIS, DE PROPOSITO REDUNDANTES — cada um falha de um jeito:
     1. faixa fixa no topo ....... sempre funciona; exige olhar a tela
     2. título da aba piscante ... visível na barra de tarefas; sem permissão
     3. som ...................... alcança quem não olha; exige clique prévio
     4. notificação do sistema .. alcança janela em segundo plano; exige
                                   permissão, que a política de GPO pode negar
   Os canais 3 e 4 são os únicos que dependem de autorização; por isso os
   canais 1 e 2 jamais podem depender deles.

   DISPARO POR TRANSIÇÃO, NÃO POR ESTADO. Som e notificação saem quando o
   nível SOBE, não a cada ciclo de 30 min em que a condição persiste — do
   contrário o operador desliga o som no segundo ciclo e o instrumento perde
   a função. A faixa, essa sim, permanece enquanto a condição durar.
   ========================================================================= */

/* Ponto de corte de interrupção: ORD.vermelho. Vermelho já manda acionar o
   ANEXO I e suspender atividade externa — esperar o crítico consumiria
   justamente a janela em que a ação preventiva ainda é possível. Âmbar fica
   de fora por frequência: 40 km/h é corriqueiro, e alarme corriqueiro é
   alarme ignorado. */
const AL_MIN    = ORD.vermelho;
/* Idade máxima do dado por sítio: o dobro do período. Um ciclo perdido é
   normal; dois seguidos significam que aquele sítio deixou de responder.
   Deriva de PERIODO — não é constante nova e acompanha a cláusula 7.4. */
const AL_IDADE  = 2*PERIODO;
const AL_REPETE = 25*1000;   // reincidência sonora do crítico não reconhecido

let ULTSITE   = {};          // cod -> ts da última rajada válida
let AL_EST    = {};          // cod -> nível já alertado
let AL_DET    = {};          // cod -> ts da detecção
let AL_STALE  = {};          // cod -> ts da detecção de perda de dado
let AL_RECON  = {};          // "cod|nivel" -> ts do reconhecimento
let AL_ATIVOS = [];          // grupos montados por avaliarAlertas()
let AL_ARMADO = false;
let AL_ACTX = null, AL_SOM = null, AL_TTL = null;
const AL_CARGA  = Date.now();
const AL_TTLBASE = document.title;

/* --- som sintetizado: nada de arquivo de áudio, a propriedade autocontida
   não admite binário externo. Três padrões distintos POR RITMO E ALTURA, de
   modo que o operador identifique a natureza do evento sem olhar a tela —
   a mesma lógica da codificação redundante, aplicada ao ouvido. */
function alBip(f, dur, atraso){
  if(!AL_ACTX) return;
  try{
    const t = AL_ACTX.currentTime + atraso;
    const o = AL_ACTX.createOscillator(), g = AL_ACTX.createGain();
    o.type = "square"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.20, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AL_ACTX.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){ /* som é reforço; sua falha não pode interromper o alerta */ }
}
const AL_PADRAO = {critico:[0,.15,.30,.45], vermelho:[0,.24], indef:[0]};
const AL_FREQ   = {critico:1150, vermelho:840, indef:390};
function alSom(nv){
  if(!AL_ARMADO || !AL_ACTX) return;
  (AL_PADRAO[nv]||[0]).forEach(dt => alBip(AL_FREQ[nv]||600, .14, dt));
}
/* Reincidência: SOMENTE o crítico não reconhecido reincide. Vermelho e perda
   de dado soam uma vez por transição. */
function alSomCiclo(){
  if(AL_SOM){ clearInterval(AL_SOM); AL_SOM = null; }
  if(!AL_ARMADO) return;
  const g = AL_ATIVOS.find(x => x.nv === "critico");
  if(!g) return;
  if(!g.cods.some(c => !AL_RECON[c+"|critico"])) return;
  AL_SOM = setInterval(() => alSom("critico"), AL_REPETE);
}

function alNotificar(nv, linha){
  if(!AL_ARMADO) return;
  try{
    if(typeof Notification === "undefined" || Notification.permission !== "granted") return;
    new Notification(T().alNotifT, {
      body: T().alTit[nv].toUpperCase() + " · " + linha,
      tag: "ns-cockpit-" + nv,
      requireInteraction: nv === "critico",
    });
  }catch(e){ /* política de GPO pode bloquear; demais canais seguem */ }
}

/* Título piscante: único canal que alcança a barra de tarefas SEM depender de
   permissão alguma. Por isso é o último a ser removido em qualquer refatoração. */
function alTitulo(){
  if(AL_TTL){ clearInterval(AL_TTL); AL_TTL = null; document.title = AL_TTLBASE; }
  const g = AL_ATIVOS.find(x => x.nv === "critico") || AL_ATIVOS.find(x => x.nv === "vermelho");
  if(!g) return;
  const marca = GLIFO[g.nv] + " " + T().alTit[g.nv].toUpperCase() + " — " + g.cods.join(", ");
  let alt = false;
  document.title = marca;
  AL_TTL = setInterval(() => { alt = !alt; document.title = alt ? AL_TTLBASE : marca; }, 1300);
}


/* =========================================================================
   rev.28 — REGISTRO AUTOMATICO DE ALERTA VERMELHO E CRITICO
   Todo sitio em vermelho ou critico, por rajada (clausula 8.1) ou por sismo
   no raio (clausula 8.2), gera um registro sem intervencao do operador.
   Nenhum limiar novo: usa nivelVento(), o nivel ja calculado de cada sismo e
   o mesmo ponto de corte da faixa de alerta (AL_MIN).

   Quem grava e a sessao de EDICAO aberta na estacao: salvarReg() e o RLS
   continuam valendo, e uma estacao so de leitura nao grava nada.

   DEDUPLICACAO — varias estacoes podem estar abertas e cada recarga da
   pagina reavalia tudo. Por isso a decisao nao depende de "transicao vista
   nesta estacao", e sim do que JA EXISTE na base (recarregada antes):
     · sismo: um registro por evento USGS e por sitio (id gravado em obs);
     · vento: nao grava se ja ha registro do mesmo sitio, tipo vento, nivel
       igual ou superior, nas ultimas AUTO_JAN horas e posterior a ultima
       vez que esta estacao viu o sitio sair do alerta. Escalada de
       vermelho para critico gera registro novo.
   Registros manuais contam para a deduplicacao: se o operador ja lavrou,
   o automatico nao duplica.
   ========================================================================= */
const AUTO_JAN  = 12*3600*1000;
const AUTO_SAIU = {};            // "cod|vento" -> ts em que esta estacao viu o fim do alerta
const AUTO_EST  = {};            // "cod|vento" -> ultimo nivel observado
const AUTO_FEITO = {};           // "cod|nivel" -> ts do registro automatico nesta estacao
let AUTO_BUSY = false;
const AUTO_TX = {
  pt:{auto:"automático", obs:(nv)=>"Registro automático: alerta "+nv+" detectado pelo cockpit. Confirmar na fonte oficial do país (cláusula 5.3) e complementar com a ação executada.",
      ok:"Registrado automaticamente", valS:"a"},
  es:{auto:"automático", obs:(nv)=>"Registro automático: alerta "+nv+" detectada por el cockpit. Confirmar en la fuente oficial del país (cláusula 5.3) y complementar con la acción ejecutada.",
      ok:"Registrado automáticamente", valS:"a"},
  en:{auto:"automatic", obs:(nv)=>"Automatic record: "+nv+" alert detected by the cockpit. Confirm with the country's official source (clause 5.3) and add the action taken.",
      ok:"Logged automatically", valS:"at"}};
const autoTx = () => AUTO_TX[LANG] || AUTO_TX.pt;
const ehAuto = r => typeof r.resp === "string" && r.resp.indexOf("AUTO") === 0;

function autoCandidatos(){
  const agora = Date.now(), lista = [];
  SITES.forEach(s=>{
    const d = DADOS[s.cod] || {}, v = d.atual;
    /* vento */
    const kV = s.cod + "|vento";
    const nvV = v && v.rajada != null ? nivelVento(v.rajada) : "indef";
    if(nvV !== "indef"){
      if(ORD[nvV] >= AL_MIN){
        lista.push({site:s.cod, tipo:"vento", nivel:nvV,
          valor: num(v.rajada,0) + " km/h", fonte:"Open-Meteo", chave:null});
      }else if(AUTO_EST[kV] && ORD[AUTO_EST[kV]] >= AL_MIN){
        AUTO_SAIU[kV] = agora;
      }
      AUTO_EST[kV] = nvV;
    }
    /* sismo: cada evento no raio em vermelho/critico e um fato proprio */
    (d.sismos||[]).forEach(e=>{
      if(!e || !e.id || ORD[e.nivel] < AL_MIN) return;
      lista.push({site:s.cod, tipo:"sismo", nivel:e.nivel,
        valor: "M " + num(e.mag,1) + " " + autoTx().valS + " " + num(e.dist,0) + " km",
        fonte:"USGS", chave:"USGS " + e.id});
    });
  });
  return lista;
}

function autoJaRegistrado(c){
  if(c.chave) return REGS.some(r => r.site === c.site && typeof r.obs === "string" && r.obs.indexOf(c.chave) >= 0);
  const agora = Date.now(), saiu = AUTO_SAIU[c.site + "|vento"] || 0;
  return REGS.some(r => r.site === c.site && r.tipo === "vento"
    && ORD[r.nivel] >= ORD[c.nivel]
    && (agora - new Date(r.ts).getTime()) < AUTO_JAN
    && new Date(r.ts).getTime() > saiu);
}

async function autoRegistrar(){
  if(AUTO_BUSY) return;
  const cands = autoCandidatos();
  if(!PODE_EDITAR || !cands.length) return;
  AUTO_BUSY = true;
  try{
    /* base atualizada ANTES de decidir: outra estacao pode ter gravado */
    try{ await carregarRegs(); }catch(e){}
    let gravou = 0;
    for(const c of cands){
      if(autoJaRegistrado(c)) continue;
      const tx = autoTx();
      const reg = {ts:new Date().toISOString(), site:c.site, tipo:c.tipo, nivel:c.nivel,
        valor:c.valor, fonte:c.fonte + " (" + tx.auto + ")",
        resp:"AUTO · " + (USUARIO && USUARIO.email ? USUARIO.email : "cockpit"),
        obs: tx.obs(T().lvl[c.nivel]) + (c.chave ? " " + c.chave + "." : "")};
      try{
        await salvarReg(reg);
        REGS.unshift(reg);             // deduplica ainda neste mesmo laco
        AUTO_FEITO[c.site + "|" + c.nivel] = Date.now();
        gravou++;
      }catch(e){ if(e && e.semPermissao) break; }
    }
    if(gravou){ try{ await carregarRegs(); }catch(e){} renderRegs(); renderAlerta(); }
  }finally{ AUTO_BUSY = false; }
}

/* --- núcleo de decisão ------------------------------------------------- */
function avaliarAlertas(){
  const agora = Date.now();
  const grp = {critico:[], vermelho:[], indef:[]};
  const novos = [];

  SITES.forEach(s => {
    const nv  = nivelSitePainel(s.cod);          // regra única, sem duplicação
    const ant = AL_EST[s.cod] || "verde";
    if(ORD[nv] >= AL_MIN){
      grp[nv].push(s.cod);
      if(ORD[nv] > ORD[ant]){                    // transição OU escalada
        AL_DET[s.cod] = agora;
        delete AL_RECON[s.cod+"|"+nv];           // escalada reabre o alerta
        novos.push(nv);
      }
      AL_EST[s.cod] = nv;
    }else{
      AL_EST[s.cod] = "verde";
      delete AL_DET[s.cod];
      delete AL_RECON[s.cod+"|vermelho"]; delete AL_RECON[s.cod+"|critico"];
    }

    /* perda de dado — item C4. A base é a carga da página enquanto o sítio
       nunca tiver respondido: um sítio que jamais respondeu é tão cego quanto
       um que parou de responder, e "sem dado" nunca recebe verde. */
    const base = ULTSITE[s.cod] || AL_CARGA;
    if(agora - base > AL_IDADE){
      grp.indef.push(s.cod);
      if(!AL_STALE[s.cod]){ AL_STALE[s.cod] = agora; novos.push("indef"); }
    }else if(AL_STALE[s.cod]){
      delete AL_STALE[s.cod]; delete AL_RECON[s.cod+"|indef"];
    }
  });

  AL_ATIVOS = ["critico","vermelho","indef"]
    .filter(nv => grp[nv].length)
    .map(nv => ({nv, cods: grp[nv]}));

  renderAlerta(); alTitulo(); alSomCiclo();

  if(novos.length){
    const nv = novos.indexOf("critico")>=0 ? "critico"
             : novos.indexOf("vermelho")>=0 ? "vermelho" : "indef";
    alSom(nv);
    const g = AL_ATIVOS.find(x => x.nv === nv);
    if(g) alNotificar(nv, g.cods.join(", "));
  }
}

/* --- pintura ------------------------------------------------------------ */
/* A linha do sítio declara O QUE motivou o alerta. Sem o valor e sem a hora
   de detecção, a faixa vira ruído: o operador precisa saber se foi rajada ou
   sismo antes de escolher a fonte oficial que vai consultar. */
function alLinha(cod, nv){
  const s = S(cod);
  if(!s) return esc(cod);
  const d = DADOS[cod] || {}, v = d.atual;
  const p = [];
  if(nv === "indef"){
    p.push(T().alSemLeitura + " " + fmtRest(Date.now() - (ULTSITE[cod] || AL_CARGA)));
    if(SUSP) p.push(T().alSusp);
  }else{
    if(v && v.rajada != null && ORD[nivelVento(v.rajada)] >= AL_MIN)
      p.push(T().alRaj + " " + num(v.rajada, 0) + " km/h");
    const sf = (d.sismos||[]).reduce((a,b)=>(!a||(b.mag||0)>(a.mag||0))?b:a, null);
    if(sf && ORD[sf.nivel] >= AL_MIN)
      p.push(T().alMag + " " + num(sf.mag, 1) + " · " + num(sf.dist, 0) + " km");
    if(AL_DET[cod]) p.push(T().alDet + " " + hdHora(new Date(AL_DET[cod])));
  }
  return "<b>" + esc(cod) + "</b> " + esc(s.loc) + " (" + esc(s.iso) + ")"
       + (p.length ? " · " + p.map(esc).join(" · ") : "");
}

function renderAlerta(){
  const el = document.getElementById("alerta");
  if(!el) return;
  if(!AL_ATIVOS.length){ el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  el.innerHTML = AL_ATIVOS.map(g => {
    const n   = g.cods.length;
    const rec = g.cods.filter(c => AL_RECON[c+"|"+g.nv]);
    return '<div class="al-bar al-' + g.nv + '" role="alert" aria-live="assertive">'
      + '<span class="al-g" aria-hidden="true">' + GLIFO[g.nv] + '</span>'
      + '<div class="al-txt">'
        + '<div class="al-h">' + esc(T().alTit[g.nv]) + ' · ' + n + ' '
          + esc(n === 1 ? T().alSit : T().alSits) + '</div>'
        + g.cods.map(c => '<div class="al-l">' + alLinha(c, g.nv) + '</div>').join("")
        + '<div class="al-a">' + esc(T().acao[g.nv]) + '</div>'
        + '<div class="al-n">' + (g.nv === "indef" ? T().alNotaD : T().alNota) + '</div>'
        + (rec.length ? '<div class="al-ok">✔ ' + esc(T().alRecOk) + ' — '
            + esc(rec.join(", ")) + '</div>' : "")
        + (function(){ const f = g.cods.filter(c => AUTO_FEITO[c+"|"+g.nv]);
            return f.length ? '<div class="al-ok">✔ ' + esc(autoTx().ok) + ' — ' + esc(f.join(", ")) + '</div>' : ""; })()
      + '</div>'
      + '<div class="al-btns">'
        + '<button class="btn sm" data-alrec="' + esc(g.nv) + '">' + esc(T().alRec) + '</button>'
        /* rev.23 — "registrar" abre o modal de gravacao: classe .so-editor,
           como o botao da aba Registro. Reconhecer NAO grava na base (apenas
           silencia o som nesta estacao) e permanece disponivel na leitura. */
        + '<button class="btn sm so-editor" data-alreg="' + esc(g.cods[0]) + '" data-alnv="' + esc(g.nv)
          + '">' + esc(T().alReg) + '</button>'
      + '</div></div>';
  }).join("");
}

function renderBtnAlerta(){
  const b = document.getElementById("btnAlerta");
  if(!b) return;
  b.textContent = AL_ARMADO ? T().btnAlertaOn : T().btnAlerta;
  b.title = T().alSomT;
  b.classList.toggle("on", AL_ARMADO);
}

/* --- ações do operador --------------------------------------------------- */
/* Reconhecer SILENCIA, não encerra. A faixa permanece enquanto a condição
   durar — quem assume o turno seguinte precisa ver o que está em curso, e
   um botão que faz o alerta sumir da tela seria um convite a fazê-lo sumir. */
document.addEventListener("click", e => {
  const r = e.target.closest("[data-alrec]");
  if(r){
    const nv = r.dataset.alrec, g = AL_ATIVOS.find(x => x.nv === nv);
    if(g) g.cods.forEach(c => AL_RECON[c+"|"+nv] = Date.now());
    renderAlerta(); alSomCiclo();
    return;
  }
  const l = e.target.closest("[data-alreg]");
  if(l){
    const bt = document.getElementById("btnNovoReg");
    if(bt) bt.click();                                  // reaproveita a abertura padrão
    const sel = document.getElementById("mSiteSel");
    if(sel) sel.value = l.dataset.alreg;
    const nvs = document.getElementById("mNivel");
    if(nvs && [...nvs.options].some(o => o.value === l.dataset.alnv)) nvs.value = l.dataset.alnv;
  }
});

/* Armar: o clique é o gesto que o navegador exige para liberar áudio e para
   pedir permissão de notificação. O sinal de teste é deliberado — o operador
   confirma na hora que o caminho de áudio da estação funciona, em vez de
   descobrir na madrugada que o alto-falante estava mudo. */
function armarAlerta(){
  AL_ARMADO = !AL_ARMADO;
  if(AL_ARMADO){
    try{
      AL_ACTX = AL_ACTX || new (window.AudioContext || window.webkitAudioContext)();
      if(AL_ACTX.state === "suspended") AL_ACTX.resume();
    }catch(e){ AL_ACTX = null; }
    try{
      if(typeof Notification !== "undefined" && Notification.permission === "default")
        Notification.requestPermission();
    }catch(e){}
    alSom("vermelho");
  }else if(AL_SOM){ clearInterval(AL_SOM); AL_SOM = null; }
  renderBtnAlerta(); alSomCiclo();
}
liga("btnAlerta", armarAlerta);

/* =========================================================================
   rev.23  11B · PORTA DE ENTRADA

   O que esta camada faz e o que NAO faz:

   FAZ  · exige uma sessao antes de mostrar o cockpit;
        · distingue leitura de edicao pelo dominio do e-mail;
        · esconde os controles de gravacao de quem so pode ler;
        · diz, na propria tela, por que uma credencial foi recusada.

   NAO FAZ · nao protege o dado. Um navegador e um ambiente onde tudo que
     chega pode ser lido e alterado; qualquer verificacao feita aqui pode ser
     contornada pelo console em segundos. Quem impede a gravacao indevida e o
     RLS da base, que avalia (auth.jwt() ->> 'email') no servidor. Esta tela e
     a face visivel daquela regra — jamais a regra.

   A chave publicavel embutida no cockpit tambem nao e segredo: ela apenas
   identifica o projeto. O que ela permite esta escrito nas policies.
   ========================================================================= */
const PERMITIDO = e => !!e && e.toLowerCase().endsWith("@nextstream.com");

const gtEl = id => document.getElementById(id);

function gateErro(msg){
  const el = gtEl("gtErr");
  if(!el) return;
  if(!msg){ el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false; el.innerHTML = msg;
}

/* Traducao da recusa. A mensagem crua do servico vem sempre em ingles e em
   vocabulario de API; o operador precisa de uma frase que diga o que fazer.
   O texto original so aparece quando nao houver correspondencia — melhor um
   ingles obscuro do que um "erro desconhecido" que nao ajuda ninguem. */
function gateTraduzErro(err){
  const m = String(err && (err.message || err) || "").toLowerCase();
  if(/invalid login|invalid credentials|bad_credential/.test(m)) return T().gtErrCred;
  if(/email not confirmed|not_confirmed/.test(m))                return T().gtErrConf;
  if(/rate limit|too many/.test(m))                              return T().gtErrTaxa;
  if(/failed to fetch|network|load failed|timeout/.test(m))      return T().gtErrRede;
  return T().gtErr + " " + esc(err && err.message ? err.message : String(err));
}

/* Os rotulos da porta seguem o idioma como o resto do painel. aplicarI18n()
   ja cuida de [data-i]; aqui ficam os placeholders, que sao atributo e nao
   conteudo, e o realce do idioma corrente nos dois grupos de botoes. */
function gateI18n(){
  document.querySelectorAll("#gate [data-ph]").forEach(el=>{
    const v = T()[el.dataset.ph];
    if(typeof v === "string") el.placeholder = v;
  });
  document.querySelectorAll("#gate [data-i]").forEach(el=>{
    const v = T()[el.dataset.i];
    if(typeof v === "string") el.innerHTML = v;
  });
  document.querySelectorAll("[data-glang]").forEach(b=>b.classList.toggle("on", b.dataset.glang === LANG));
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on", b.dataset.lang === LANG));
}

/* Um unico ponto decide tudo que depende da sessao. Chamado na carga, a cada
   troca de estado da autenticacao e depois de entrar ou sair — nunca ha dois
   lugares discordando sobre quem esta na estacao. */
function atualizarEstado(){
  PODE_EDITAR = PERMITIDO(USUARIO && USUARIO.email);
  const liberado = !!USUARIO || SEM_AUTH;

  document.body.classList.toggle("gate-on", !liberado);
  document.body.classList.toggle("pode-editar", PODE_EDITAR);

  const barra = gtEl("barra-login");
  if(barra) barra.hidden = !USUARIO;
  const quem = gtEl("quem");
  if(quem) quem.textContent = USUARIO ? USUARIO.email : "";
  const chip = gtEl("chip-leitura");
  if(chip) chip.hidden = !(USUARIO && !PODE_EDITAR);

  /* A aba Registro e a faixa de alerta trazem botoes .so-editor gerados por
     script: repinta-las mantem a interface coerente com a sessao. */
  if(typeof renderAlerta === "function") renderAlerta();
  if(typeof renderRegs === "function" && typeof REGS !== "undefined") renderRegs();

  /* rev.27 — quem so visualiza nao permanece na aba Registro: se a sessao
     perdeu o perfil de edicao com a aba aberta, volta ao Painel. */
  if(!PODE_EDITAR){
    const ativa = document.querySelector('nav button.on');
    if(ativa && ativa.dataset.v === "registro"){
      const p = document.querySelector('nav button[data-v="painel"]');
      if(p) p.click();
    }
  }
}

async function entrar(ev){
  if(ev && ev.preventDefault) ev.preventDefault();
  const email = (gtEl("email").value || "").trim();
  const senha = gtEl("senha").value || "";
  gateErro("");
  if(!email || !senha) return gateErro(esc(T().gtErrVazio));

  const cli = await sbCliente();
  if(!cli){ gtEl("btn-leitura").hidden = false; return gateErro(esc(T().gtErrLib)); }

  const bt = gtEl("btn-entrar");
  bt.disabled = true; bt.textContent = T().gtEntrando;
  try{
    const {data, error} = await cli.auth.signInWithPassword({email, password:senha});
    if(error) return gateErro(gateTraduzErro(error));
    USUARIO = (data && data.user) || null;
    gtEl("senha").value = "";
    atualizarEstado();
    /* Entrou: o que ficou retido nesta estacao enquanto ninguem estava
       autenticado sobe agora, e a aba passa a mostrar a base inteira. */
    try{ await carregarRegs(); renderRegs(); }catch(e){}
    autoRegistrar().catch(()=>{});   /* rev.28 */
  }catch(e){
    gateErro(gateTraduzErro(e));
  }finally{
    bt.disabled = false; bt.textContent = T().gtEntrar;
  }
}

async function sair(){
  try{ const cli = await sbCliente(); if(cli) await cli.auth.signOut(); }catch(e){}
  USUARIO = null; SEM_AUTH = false;
  const s = gtEl("senha"); if(s) s.value = "";
  gateErro("");
  atualizarEstado();
}

async function iniciarAuth(){
  const cli = await sbCliente();

  if(!cli){
    /* Sem biblioteca nao ha como autenticar. A porta permanece fechada, mas
       com a saida de contingencia a vista: o cockpit continua util sem a
       base — vento e sismo vem dos provedores, nao dela. */
    gtEl("btn-leitura").hidden = false;
    gateErro(esc(T().gtErrLib));
    atualizarEstado();
    return;
  }

  try{
    const {data} = await cli.auth.getSession();
    USUARIO = (data && data.session && data.session.user) || null;
  }catch(e){ USUARIO = null; }

  /* Expiracao de token, saida em outra aba, renovacao: o estado da porta
     acompanha o da sessao sem que ninguem precise recarregar. */
  cli.auth.onAuthStateChange((_ev, sess)=>{
    USUARIO = (sess && sess.user) || null;
    atualizarEstado();
  });

  atualizarEstado();
}

/* --- ligacoes da porta --- */
gtEl("gate-box").addEventListener("submit", entrar);
liga("btn-sair", sair);
liga("btn-leitura", ()=>{
  SEM_AUTH = true;          /* leitura sem sessao: PODE_EDITAR segue falso */
  atualizarEstado();
});
document.querySelectorAll("[data-glang]").forEach(b=>{
  b.onclick = ()=>{
    LANG = b.dataset.glang;
    render(); setDb(); tick(); gateI18n();
  };
});
/* Os botoes PT/ES/EN do cabecalho ja tem tratador proprio; este ouvinte
   apenas mantem a porta no mesmo idioma, sem tocar naquele codigo. */
document.addEventListener("click", e=>{
  if(e.target.closest(".langs button")) gateI18n();
});

/* ---------------------------------------------- 12. INICIALIZACAO */
(async function init(){
  render();
  gateI18n();
  /* A porta e resolvida ANTES de qualquer outra coisa. O restante da carga
     prossegue por tras dela: quando o operador entra, o painel ja esta
     pronto, em vez de comecar a coletar naquele instante. */
  await iniciarAuth();
  await carregarRegs(); renderRegs();
  /* rev.10 — cadencia de um segundo: alimenta relogio e contagem regressiva.
     Custo desprezivel, apenas dois nos de texto atualizados. */
  /* rev.21 — a idade do dado envelhece SOZINHA, sem coleta nova: a perda
     de dado precisa ser reavaliada pelo relógio, não pelo ciclo. A cada 15 s
     e não a cada segundo — a faixa é repintada por inteiro e não há razão
     para fazê-lo quinze vezes a mais do que o necessário. */
  let alTk = 0;
  tick(); renderCiclo(); renderBtnAlerta();
  setInterval(()=>{ tick(); renderCiclo(); if(++alTk % 15 === 0) avaliarAlertas(); }, 1000);
  /* rev.10 — o involucro coletar() ja trata excecao e agenda o proximo ciclo
     no bloco finally; setInterval foi substituido por temporizador encadeado. */
  await coletar();
})();
</script>
